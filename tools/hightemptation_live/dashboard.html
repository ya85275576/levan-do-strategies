<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HighTempTation 实盘仪表板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0d1117; color: #c9d1d9; min-height: 100vh;
  }
  .container { max-width: 1440px; margin: 0 auto; padding: 16px 20px; }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px; margin-bottom: 14px;
    background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
    border: 1px solid #30363d; border-radius: 12px; flex-wrap: wrap; gap: 8px;
  }
  .header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .logo { font-size: 18px; font-weight: 800; letter-spacing: 0.4px; color: #58a6ff; }
  .logo span { color: #f0883e; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 16px; font-size: 11px; font-weight: 600;
  }
  .status-pill.online { background: #1b3d2b; color: #3fb950; border: 1px solid #2ea043; }
  .status-pill.offline { background: #3d1b1b; color: #f85149; border: 1px solid #da3633; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .status-dot.green { background: #3fb950; box-shadow: 0 0 4px #3fb950; }
  .status-dot.red { background: #f85149; box-shadow: 0 0 4px #f85149; }

  .refresh-bar { display: flex; align-items: center; gap: 6px; font-size: 10px; color: #484f58; }
  .refresh-bar .countdown { color: #8b949e; font-family: 'Consolas',monospace; min-width: 28px; text-align: center; }
  .refresh-bar .bar-track { width: 50px; height: 3px; background: #21262d; border-radius: 2px; overflow: hidden; }
  .refresh-bar .bar-fill { height: 100%; background: #58a6ff; border-radius: 2px; transition: width 0.3s linear; }

  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .card-title {
    font-size: 12px; font-weight: 600; color: #8b949e; text-transform: uppercase;
    letter-spacing: 0.3px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
  }

  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) { .stats-grid { grid-template-columns: 1fr; } }
  .stat-card {
    background: linear-gradient(135deg, #1a1d29 0%, #161b22 100%);
    border: 1px solid #2d3343; border-radius: 8px; padding: 10px 12px;
    position: relative; overflow: hidden;
  }
  .stat-card .sv { font-size: 20px; font-weight: 700; font-family: 'Consolas', monospace; }
  .stat-card .sl { font-size: 10px; color: #6a7283; margin-top: 1px; text-transform: uppercase; letter-spacing: 0.2px; }
  .stat-card .sc { font-size: 11px; font-weight: 600; margin-top: 2px; }
  .positive { color: #0ecb81; }
  .negative { color: #f6465d; }
  .neutral { color: #8b949e; }

  .chart-container { position: relative; height: 200px; width: 100%; }

  .data-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .data-table th {
    text-align: left; padding: 6px 8px; border-bottom: 2px solid #30363d;
    color: #8b949e; font-weight: 600; font-size: 10px; text-transform: uppercase; white-space: nowrap;
  }
  .data-table td { padding: 5px 8px; border-bottom: 1px solid #21262d; white-space: nowrap; }
  .data-table tr:hover td { background: #1c2128; }

  .dir-yes { color: #0ecb81; font-weight: 700; }
  .dir-no { color: #f6465d; font-weight: 700; }

  .scroll-wrap { max-height: 320px; overflow-y: auto; }
  .scroll-wrap-sm { max-height: 240px; overflow-y: auto; }

  .empty-state { text-align: center; padding: 24px 12px; color: #484f58; }
  .empty-state .icon { font-size: 26px; margin-bottom: 4px; }
  .empty-state .text { font-size: 12px; }

  .loading { text-align: center; padding: 40px; color: #8b949e; }
  .loading .spinner {
    width: 28px; height: 28px; border: 3px solid #21262d;
    border-top-color: #58a6ff; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer {
    text-align: center; padding: 14px; color: #484f58; font-size: 10px;
    border-top: 1px solid #21262d; margin-top: 28px;
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>加载仪表板数据...</div>
  </div>
</div>

<script>
// ── 开关：true=真实API(数据适配完成), false=模拟数据 ──
const USE_REAL_API = true;

const FETCH_INTERVAL = 30000;
let equityChart = null;
let refreshTimer = null;
let countdownValue = FETCH_INTERVAL / 1000;
let lastRawData = null;

/* ==================================================================
   /api/status → 内部数据模型映射

   原始 API 字段                    映射为
   ──────────────────────────────────────────────────────
   raw.open                         positions[]
     .entry_no                      .entry_price
     .curr_no                       .price
     .size                          .shares
   raw.recent_closed                 closed[]
     .realized                      .pnl
     .exit_reason                   .reason
     .exit_time                     .timestamp
   raw.capital_history               equity_curve[]
     [{t: ms, e: equity}]           {timestamp, capital}
   raw.total                        total_trades
   raw.win_rate                     win_rate
   raw.daily_pnl                    daily_pnl

   signals: 从 holdings 中 pct > 3% 的持仓派生
   maxDD: 从 equity_curve 计算
   ================================================================== */

/** generateMockData() — 无后端时的演示数据（天气 Bot 格式） */
function generateMockData() {
  const now = Date.now();
  const capHist = [];
  for (let i=30; i>=0; i--) { capHist.push({t: now - i*60000, e: 10000 + Math.sin(i/3)*200 + i*15}); }

  const holdings = [
    { city:'Tokyo',       bucket:'33-35\u00b0C', entry_price:0.45, price:0.52, shares:8,  pnl:0.56,  pct:15.6, date:'2026-07-31' },
    { city:'Seoul',       bucket:'\u226430\u00b0C',   entry_price:0.38, price:0.41, shares:10, pnl:0.30,  pct:7.9,  date:'2026-07-31' },
    { city:'New York',    bucket:'35-37\u00b0C', entry_price:0.55, price:0.48, shares:6,  pnl:-0.42, pct:-12.7,date:'2026-07-30' },
  ];
  const closed = [
    { city:'Singapore',   bucket:'\u226432\u00b0C',   pnl:1.20, reason:'NO\u22650.98 \u76ee\u6807\u8fbe\u6210',        timestamp:new Date(now-1800000).toISOString(), date:'2026-07-29' },
    { city:'London',      bucket:'25-27\u00b0C', pnl:0.85, reason:'\u5feb\u76c8+5% $0.42\u2192$0.47',      timestamp:new Date(now-3600000).toISOString(), date:'2026-07-29' },
    { city:'Dubai',       bucket:'43+\u00b0C',   pnl:-1.50,reason:'\u6b62\u635f $0.55\u2192$0.18',         timestamp:new Date(now-7200000).toISOString(), date:'2026-07-28' },
  ];
  return {
    capital: 10082.45, total_pnl: 82.45, daily_pnl: 12.30,
    total_trades: 45, win_rate: 62.2, open_count: holdings.length, closed_count: 42,
    holdings, closed, equity_curve: capHist, maxDD: -8.3, raw: {},
  };
}

/* ==================================================================
   fetchData() — 适配 /api/status 真实字段
   ================================================================== */
async function fetchData() {
  if (!USE_REAL_API) return generateMockData();

  try {
    const r = await fetch('/api/status');
    if (!r.ok) throw new Error(String(r.status));
    const raw = await r.json();
    if (!raw || raw.capital == null) throw new Error('\u7f3a\u5c11 capital');

    // holdings: raw.open
    const holdings = (raw.open || []).map(p => ({
      city:         p.city || '--',
      bucket:       p.bucket || '--',
      entry_price:  p.entry_no || 0,
      price:        p.curr_no || 0,
      shares:       p.size || 0,
      pnl:          p.pnl || 0,
      pct:          p.pct || 0,
      date:         p.date || '',
    }));

    // closed: raw.recent_closed
    const closed = (raw.recent_closed || []).slice(-30).map(t => ({
      city:       t.city || '--',
      bucket:     t.bucket || '--',
      pnl:        t.realized != null ? t.realized : (t.pnl || 0),
      reason:     t.exit_reason || '',
      timestamp:  t.exit_time || '',
      date:       t.date || '',
    }));

    // equity_curve: raw.capital_history [{t: ms, e: equity}]
    const ch = raw.capital_history || [];
    const equity_curve = ch.map(p => ({
      timestamp: p.t ? new Date(p.t).toISOString() : '',
      capital:   p.e != null ? p.e : 0,
    }));

    // max drawdown
    let maxDD = 0;
    if (equity_curve.length >= 2) {
      let peak = equity_curve[0].capital;
      for (const pt of equity_curve) {
        if (pt.capital > peak) peak = pt.capital;
        const dd = (pt.capital - peak) / peak * 100;
        if (dd < maxDD) maxDD = dd;
      }
    }

    // signals: holdings where pct > 3%
    const signals = holdings.filter(h => h.pct > 3).map(h => ({
      city: h.city, bucket: h.bucket,
      entry_price: h.entry_price, price: h.price, pct: h.pct,
    }));

    return {
      capital:      raw.capital || 0,
      total_pnl:    raw.total_pnl || 0,
      daily_pnl:    raw.daily_pnl || 0,
      total_trades: raw.total || 0,
      win_rate:     raw.win_rate || 0,
      open_count:   holdings.length,
      closed_count: raw.closed_count || closed.length,
      holdings,
      closed,
      equity_curve,
      signals,
      maxDD: Math.round(maxDD * 10) / 10,
      raw,
    };
  } catch(e) {
    console.warn('[仪表板] /api/status 请求失败:', e.message);
    return generateMockData();
  }
}

/* ==================================================================
   辅助函数
   ================================================================== */
function $(s) { return document.querySelector(s); }
function esc(v) { if(v==null)return'';var d=document.createElement('div');d.textContent=String(v);return d.innerHTML; }
function pnlCls(v) { return v==null?'':(v>0?'positive':(v<0?'negative':'')); }
function pnlSign(v) { return v==null?'':(v>0?'+':''); }
function fmtTime(iso) {
  if (!iso) return '\u2014';
  return new Date(iso).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}

/* =========== RENDER: HEADER =========== */
function renderHeader(d) {
  return '<div class="header"><div class="header-left">'+
    '<div class="logo">HighTemp<span>Tation</span>\u00ae</div>'+
    '<span class="status-pill online"><span class="status-dot green"></span>\u8fd0\u884c\u4e2d</span>'+
    '</div><div class="header-right">'+
    '<div class="refresh-bar"><span class="countdown" id="countdown">'+countdownValue+'s</span>'+
    '<div class="bar-track"><div class="bar-fill" id="refreshBarFill"></div></div></div>'+
    '</div></div>';
}

/* =========== RENDER: CARDS =========== */
function renderCards(d) {
  const totalPnl = d.total_pnl || 0;
  const dailyPnl = d.daily_pnl || 0;
  const capital = d.capital || 0;

  return '<div class="card"><div class="card-title">\ud83d\udcca \u8d26\u6237\u603b\u89c8</div><div class="stats-grid">'+
    '<div class="stat-card" style="border-left:3px solid #58a6ff"><div class="sv" style="color:#58a6ff">$'+Number(capital).toFixed(2)+'</div><div class="sl">\u5f53\u524d\u8d44\u91d1</div></div>'+
    '<div class="stat-card" style="border-left:3px solid '+(totalPnl>=0?'#0ecb81':'#f6465d')+'"><div class="sv '+(totalPnl>=0?'positive':'negative')+'">'+pnlSign(totalPnl)+'$'+Math.abs(totalPnl).toFixed(2)+'</div><div class="sl">\u603b P&L</div></div>'+
    '<div class="stat-card" style="border-left:3px solid '+(dailyPnl>=0?'#0ecb81':'#f6465d')+'"><div class="sv '+(dailyPnl>=0?'positive':'negative')+'">'+pnlSign(dailyPnl)+'$'+Math.abs(dailyPnl).toFixed(2)+'</div><div class="sl">\u4eca\u65e5 P&L</div></div>'+
    '<div class="stat-card" style="border-left:3px solid #bc8cff"><div class="sv neu">'+d.win_rate+'%</div><div class="sl">\u80dc\u7387 ('+d.total_trades+'\u7b14)</div></div>'+
    '<div class="stat-card" style="border-left:3px solid #f0883e"><div class="sv" style="color:#f0883e">'+d.open_count+'</div><div class="sl">\u6301\u4ed3</div><div class="sc neutral">\u5df2\u5e73 '+d.closed_count+'</div></div>'+
    '<div class="stat-card" style="border-left:3px solid '+(d.maxDD<0?'#f6465d':'#8b949e')+'"><div class="sv '+(d.maxDD<0?'negative':'neutral')+'">'+d.maxDD.toFixed(1)+'%</div><div class="sl">\u6700\u5927\u56de\u62bd</div></div>'+
    '</div></div>';
}

/* =========== RENDER: EQUITY CHART =========== */
function renderChart(d) {
  const ec = d.equity_curve || [];
  if (ec.length < 2) {
    return '<div class="card"><div class="card-title">\ud83d\udcc8 \u8d44\u91d1\u66f2\u7ebf</div><div class="chart-container"><canvas id="eqChart"></canvas></div></div>';
  }
  return '<div class="card"><div class="card-title">\ud83d\udcc8 \u8d44\u91d1\u66f2\u7ebf <span style="font-weight:400;color:#484f58;font-size:10px">'+ec.length+' \u4e2a\u91c7\u6837\u70b9</span></div><div class="chart-container"><canvas id="eqChart"></canvas></div></div>';
}

function drawChart(d) {
  const ec = d.equity_curve || [];
  const canvas = document.getElementById('eqChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  const valid = ec.filter(p => p && p.capital != null);
  if (valid.length < 2) {
    if (equityChart) { equityChart.destroy(); equityChart=null; }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#484f58'; ctx.font='13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('\u7b49\u5f85\u66f4\u591a\u6570\u636e...',canvas.width/2,canvas.height/2);
    return;
  }

  const labels = valid.map(p => {
    try { return new Date(p.timestamp).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); } catch(e) { return ''; }
  });
  const data = valid.map(p => p.capital);
  const startVal = data[0], endVal = data[data.length-1];
  const isUp = endVal >= startVal;
  const lineColor = isUp ? '#0ecb81' : '#f6465d';

  if (equityChart) {
    equityChart.data.labels = labels;
    equityChart.data.datasets[0].data = data;
    equityChart.data.datasets[0].borderColor = lineColor;
    equityChart.update('none');
    return;
  }

  equityChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '\u6743\u76ca ($)',
        data,
        borderColor: lineColor,
        backgroundColor: g=>{
          const gc=g.chart.ctx.createLinearGradient(0,0,0,200);
          gc.addColorStop(0, isUp ? 'rgba(14,203,129,0.2)' : 'rgba(246,70,93,0.2)');
          gc.addColorStop(1, 'rgba(14,203,129,0.01)');
          return gc;
        },
        fill: true, tension: 0.3, pointRadius: 0, pointHitRadius: 6, borderWidth: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1c2128', titleColor: '#8b949e', bodyColor: '#f0f6fc',
          borderColor: '#30363d', borderWidth: 1, padding: 6,
          callbacks: { label: ctx=>'$'+Number(ctx.raw).toLocaleString('en-US',{minimumFractionDigits:2}) }
        }
      },
      scales: {
        x: { display: true, grid: {color:'#21262d',drawBorder:false}, ticks: {color:'#484f58',font:{size:9},maxTicksLimit:8} },
        y: { display: true, grid: {color:'#21262d',drawBorder:false}, ticks: {color:'#484f58',font:{size:9},callback:v=>'$'+v.toLocaleString()} }
      }
    }
  });
}

/* =========== RENDER: HOLDINGS =========== */
function renderHoldings(d) {
  const hh = d.holdings || [];
  let html = '<div class="card"><div class="card-title">\ud83d\udcbc \u6301\u4ed3 <span style="font-weight:400;color:#6a7283;font-size:10px">'+hh.length+' \u4e2a</span></div>';
  if (hh.length===0) {
    return html + '<div class="empty-state"><div class="icon">\ud83d\udce6</div><div class="text">\u6682\u65e0\u6301\u4ed3</div></div></div>';
  }

  html += '<div class="scroll-wrap"><table class="data-table"><thead><tr>'+
    '<th>\u57ce\u5e02</th><th>\u6876</th><th>\u65e5\u671f</th><th>\u5206\u989d</th><th>\u5165\u573a\u4ef7</th><th>\u5f53\u524d\u4ef7</th><th>P&L</th><th>%</th>'+
  '</tr></thead><tbody>';

  for (const p of hh) {
    html += '<tr>'+
      '<td style="font-weight:600">'+esc(p.city)+'</td>'+
      '<td style="font-size:10px;color:#8b949e">'+esc(p.bucket)+'</td>'+
      '<td style="font-size:10px;color:#8b949e">'+esc(p.date)+'</td>'+
      '<td style="font-family:Consolas,monospace">'+Number(p.shares||0).toFixed(0)+'</td>'+
      '<td style="font-family:Consolas,monospace">$'+Number(p.entry_price||0).toFixed(4)+'</td>'+
      '<td style="font-family:Consolas,monospace">$'+Number(p.price||0).toFixed(4)+'</td>'+
      '<td style="font-family:Consolas,monospace;font-weight:600;'+pnlCls(p.pnl)+'">'+pnlSign(p.pnl)+'$'+Math.abs(p.pnl||0).toFixed(2)+'</td>'+
      '<td style="font-family:Consolas,monospace;font-weight:600;'+pnlCls(p.pct)+'">'+pnlSign(p.pct)+Math.abs(p.pct||0).toFixed(1)+'%</td></tr>';
  }

  html += '</tbody></table></div></div>';
  return html;
}

/* =========== RENDER: SIGNALS =========== */
function renderSignals(d) {
  const sg = d.signals || [];
  if (sg.length===0) {
    return '<div class="card"><div class="card-title">\ud83d\udd14 \u6d3b\u8dc3\u4fe1\u53f7 (pct>3%)</div><div class="empty-state"><div class="icon">\ud83d\udd07</div><div class="text">\u65e0\u6d3b\u8dc3\u4fe1\u53f7</div></div></div>';
  }
  let html = '<div class="card"><div class="card-title">\ud83d\udd14 \u6d3b\u8dc3\u4fe1\u53f7 <span style="font-weight:400;color:#6a7283;font-size:10px">'+sg.length+' \u4e2a</span></div>'+
    '<table class="data-table"><thead><tr><th>\u57ce\u5e02</th><th>\u6876</th><th>\u5165\u573a\u4ef7</th><th>\u5f53\u524d\u4ef7</th><th>\u6da8\u5e45</th></tr></thead><tbody>';
  for (const s of sg) {
    html += '<tr><td style="font-weight:600">'+esc(s.city)+'</td>'+
      '<td style="font-size:10px;color:#8b949e">'+esc(s.bucket)+'</td>'+
      '<td style="font-family:Consolas,monospace">$'+Number(s.entry_price||0).toFixed(4)+'</td>'+
      '<td style="font-family:Consolas,monospace">$'+Number(s.price||0).toFixed(4)+'</td>'+
      '<td style="font-family:Consolas,monospace;font-weight:600;'+pnlCls(s.pct)+'">'+pnlSign(s.pct)+Math.abs(s.pct||0).toFixed(1)+'%</td></tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

/* =========== RENDER: CLOSED =========== */
function renderClosed(d) {
  const cl = d.closed || [];
  if (cl.length===0) {
    return '<div class="card"><div class="card-title">\ud83d\udcdc \u6700\u8fd1\u5e73\u4ed3</div><div class="empty-state"><div class="icon">\ud83d\udced</div><div class="text">\u6682\u65e0\u5e73\u4ed3\u8bb0\u5f55</div></div></div>';
  }

  const totalPnl = cl.reduce((s,t)=>s+(t.pnl||0), 0);
  const pnlColor = totalPnl>=0?'#3fb950':'#f85149';

  let html = '<div class="card"><div class="card-title">\ud83d\udcdc \u6700\u8fd1\u5e73\u4ed3 <span style="font-weight:400;color:#484f58;font-size:10px">\u5171 '+cl.length+' \u7b14 \u00b7 \u603b\u76c8\u4e8f <span style="color:'+pnlColor+'">'+
    pnlSign(totalPnl)+'$'+Math.abs(totalPnl).toFixed(2)+'</span></span></div>';

  html += '<div class="scroll-wrap-sm"><table class="data-table"><thead><tr>'+
    '<th>\u57ce\u5e02</th><th>\u6876</th><th>\u76c8\u4e8f</th><th>\u539f\u56e0</th><th>\u65f6\u95f4</th>'+
  '</tr></thead><tbody>';

  for (const t of cl.slice(-20).reverse()) {
    html += '<tr><td style="font-weight:600">'+esc(t.city)+'</td>'+
      '<td style="font-size:10px;color:#8b949e">'+esc(t.bucket)+'</td>'+
      '<td style="font-family:Consolas,monospace;font-weight:600;'+pnlCls(t.pnl)+'">'+pnlSign(t.pnl)+'$'+Math.abs(t.pnl||0).toFixed(2)+'</td>'+
      '<td style="color:#8b949e;font-size:11px">'+esc(t.reason||'')+'</td>'+
      '<td style="color:#8b949e;font-size:10px">'+fmtTime(t.timestamp)+'</td></tr>';
  }

  html += '</tbody></table></div></div>';
  return html;
}

/* =========== RENDER: FOOTER =========== */
function renderFooter() {
  return '<div class="footer">HighTempTation\u00ae &middot; \u6bcf '+FETCH_INTERVAL/1000+'s \u5237\u65b0 &middot; '+
    '<a href="/api/status" style="color:#58a6ff;text-decoration:none">/api/status</a></div>';
}

/* =========== MAIN RENDER =========== */
function renderDashboard(d) {
  const h = renderHeader(d) + renderCards(d) + renderChart(d) + renderHoldings(d) + renderSignals(d) + renderClosed(d) + renderFooter();
  document.getElementById('app').innerHTML = h;
  drawChart(d);
}

async function refresh() {
  const d = await fetchData();
  lastRawData = d;
  if (!d) {
    document.getElementById('app').innerHTML =
      '<div class="container"><div class="empty-state" style="padding:60px 20px">'+
      '<div class="icon">\u26a0\ufe0f</div><div class="text">\u65e0\u6cd5\u83b7\u53d6\u6570\u636e</div></div></div>';
    return;
  }
  document.getElementById('loading').style.display = 'none';
  renderDashboard(d);
  resetCountdown();
}

function resetCountdown() { countdownValue = FETCH_INTERVAL/1000; updateCountdown(); }
function updateCountdown() {
  const el=document.getElementById('countdown');
  const bar=document.getElementById('refreshBarFill');
  if (el) el.textContent=countdownValue+'s';
  if (bar) bar.style.width=((FETCH_INTERVAL/1000-countdownValue)/(FETCH_INTERVAL/1000)*100)+'%';
}
function startCountdown() {
  resetCountdown();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer=setInterval(()=>{
    countdownValue--;
    if (countdownValue<=0) { countdownValue=FETCH_INTERVAL/1000; refresh(); }
    updateCountdown();
  },1000);
}

document.addEventListener('DOMContentLoaded', ()=>{ refresh(); startCountdown(); });
</script>
</body>
</html>
