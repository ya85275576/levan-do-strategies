<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LE VAN DO® 交易仪表板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0d1117; color: #c9d1d9; min-height: 100vh;
  }
  .container { max-width: 1440px; margin: 0 auto; padding: 16px 20px; }

  /* Header */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px; margin-bottom: 14px;
    background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
    border: 1px solid #30363d; border-radius: 12px; flex-wrap: wrap; gap: 8px;
  }
  .header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .logo { font-size: 18px; font-weight: 800; letter-spacing: 0.4px; color: #58a6ff; }
  .logo span { color: #f0883e; }
  .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 16px; font-size: 11px; font-weight: 600;
  }
  .status-pill.online { background: #1b3d2b; color: #3fb950; border: 1px solid #2ea043; }
  .status-pill.offline { background: #3d1b1b; color: #f85149; border: 1px solid #da3633; }
  .status-pill.dry-run { background: #1b2d3d; color: #58a6ff; border: 1px solid #1f6feb; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .status-dot.green { background: #3fb950; box-shadow: 0 0 4px #3fb950; }
  .status-dot.red { background: #f85149; box-shadow: 0 0 4px #f85149; }

  .refresh-bar { display: flex; align-items: center; gap: 6px; font-size: 10px; color: #484f58; }
  .refresh-bar .countdown { color: #8b949e; font-family: 'Consolas',monospace; min-width: 28px; text-align: center; }
  .refresh-bar .bar-track { width: 50px; height: 3px; background: #21262d; border-radius: 2px; overflow: hidden; }
  .refresh-bar .bar-fill { height: 100%; background: #58a6ff; border-radius: 2px; transition: width 0.3s linear; }

  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .card-title {
    font-size: 12px; font-weight: 600; color: #8b949e; text-transform: uppercase;
    letter-spacing: 0.3px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
  }

  /* ===== Account Stats Grid ===== */
  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) { .stats-grid { grid-template-columns: 1fr; } }
  .stat-card {
    background: linear-gradient(135deg, #1a1d29 0%, #161b22 100%);
    border: 1px solid #2d3343; border-radius: 8px; padding: 10px 12px;
    position: relative; overflow: hidden;
  }
  .stat-card .sv { font-size: 20px; font-weight: 700; font-family: 'Consolas', monospace; }
  .stat-card .sl { font-size: 10px; color: #6a7283; margin-top: 1px; text-transform: uppercase; letter-spacing: 0.2px; }
  .stat-card .sc { font-size: 11px; font-weight: 600; margin-top: 2px; }
  .positive { color: #0ecb81; }
  .negative { color: #f6465d; }
  .neutral { color: #8b949e; }

  .stat-card.accent-equity { border-left: 3px solid #58a6ff; }
  .stat-card.accent-pnl { border-left: 3px solid #0ecb81; }
  .stat-card.accent-loss { border-left: 3px solid #f6465d; }
  .stat-card.accent-daily { border-left: 3px solid #d29922; }
  .stat-card.accent-wr { border-left: 3px solid #3fb950; }
  .stat-card.accent-tr { border-left: 3px solid #f0883e; }
  .stat-card.accent-pos { border-left: 3px solid #58a6ff; }
  .stat-card.accent-sig { border-left: 3px solid #bc8cff; }

  /* ===== Chart ===== */
  .chart-container { position: relative; height: 200px; width: 100%; }

  /* ===== Table ===== */
  .data-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .data-table th {
    text-align: left; padding: 6px 8px; border-bottom: 2px solid #30363d;
    color: #8b949e; font-weight: 600; font-size: 10px; text-transform: uppercase; white-space: nowrap;
  }
  .data-table td { padding: 5px 8px; border-bottom: 1px solid #21262d; white-space: nowrap; }
  .data-table tr:hover td { background: #1c2128; }
  .data-table .sort-link { cursor: pointer; color: #58a6ff; user-select: none; }
  .data-table .sort-link:hover { text-decoration: underline; }

  /* Signal badge */
  .sig-badge {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-size: 9px; font-weight: 700; font-family: 'Consolas', monospace;
  }
  .sig-longE, .sig-longTP1, .sig-longTP2, .sig-longTP3 { background: #0d2818; color: #3fb950; }
  .sig-shortE, .sig-shortTP1, .sig-shortTP2, .sig-shortTP3 { background: #2d1215; color: #f85149; }
  .sig-longX, .sig-longSL { background: #1b2d3d; color: #58a6ff; }
  .sig-shortX, .sig-shortSL { background: #2d1b0e; color: #d29922; }

  /* Edge highlight */
  .edge-high { color: #f0883e; font-weight: 700; }
  .edge-high-15 { color: #f0883e; font-weight: 700; background: rgba(240,136,62,0.15); border-radius: 3px; padding: 0 4px; }

  /* Action badge */
  .act-yes { color: #0ecb81; font-weight: 600; }
  .act-no { color: #f6465d; font-weight: 600; }

  /* Position direction badge */
  .dir-yes { color: #0ecb81; font-weight: 700; }
  .dir-no { color: #f6465d; font-weight: 700; }

  /* Scrollable containers */
  .scroll-wrap { max-height: 320px; overflow-y: auto; }
  .scroll-wrap-sm { max-height: 240px; overflow-y: auto; }

  /* Progress */
  .progress-bar { height: 5px; background: #21262d; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
  .progress-fill.green { background: linear-gradient(90deg,#2ea043,#3fb950); }
  .progress-fill.blue { background: linear-gradient(90deg,#1f6feb,#58a6ff); }
  .progress-fill.red { background: linear-gradient(90deg,#da3633,#f85149); }
  .progress-fill.yellow { background: linear-gradient(90deg,#bb8009,#d29922); }

  .empty-state { text-align: center; padding: 24px 12px; color: #484f58; }
  .empty-state .icon { font-size: 26px; margin-bottom: 4px; }
  .empty-state .text { font-size: 12px; }

  .loading { text-align: center; padding: 40px; color: #8b949e; }
  .loading .spinner {
    width: 28px; height: 28px; border: 3px solid #21262d;
    border-top-color: #58a6ff; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer {
    text-align: center; padding: 14px; color: #484f58; font-size: 10px;
    border-top: 1px solid #21262d; margin-top: 28px;
  }

  /* Signal row highlight */
  .sig-row-edge { }
  .sig-row-edge.highlight { background: rgba(240,136,62,0.06); border-left: 3px solid #f0883e; }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>加载仪表板数据...</div>
  </div>
</div>

<script>
const FETCH_INTERVAL = 30000;
let equityChart = null;
let refreshTimer = null;
let countdownValue = FETCH_INTERVAL / 1000;

// Sort state for signal table
let signalSort = { key: 'edge', asc: false };

function $(s) { return document.querySelector(s); }

function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function pnlCls(v) { return v == null ? '' : (v > 0 ? 'positive' : (v < 0 ? 'negative' : '')); }
function pnlSign(v) { return v == null ? '' : (v > 0 ? '+' : ''); }

async function fetchData() {
  try {
    const r = await fetch('/api/status');
    if (!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } catch(e) { return null; }
}

// =========== RENDER HEADER ===========
function renderHeader(d) {
  const ex = d.exchange;
  const online = d.processes && d.processes.some(p=>p.status==='online');
  const dry = ex && ex.dryRun;
  let cls = online ? 'online' : 'offline';
  if (dry) cls += ' dry-run';
  return '<div class="header"><div class="header-left">'+
    '<div class="logo">LE VAN <span>DO</span>®</div>'+
    '<span class="status-pill '+cls+'"><span class="status-dot '+(online?'green':'red')+'"></span>'+(online?'运行中':'离线')+(dry?' · 模拟':'')+'</span>'+
    (ex?'<span class="status-pill '+(ex.status==='connected'?'online':'offline')+'"><span class="status-dot '+(ex.status==='connected'?'green':'red')+'"></span>'+(ex.network||'--')+'</span>':'')+
    '</div><div class="header-right">'+
    '<div class="refresh-bar"><span class="countdown" id="countdown">'+countdownValue+'s</span>'+
    '<div class="bar-track"><div class="bar-fill" id="refreshBarFill"></div></div></div>'+
    '<span style="font-size:10px;color:#8b949e">⬆ '+(d.server?d.server.uptime:'--')+'</span>'+
    '<span style="font-size:10px;color:#484f58">'+(d.server?fmtTime(d.server.time):'')+'</span>'+
    '</div></div>';
}

// =========== RENDER ACCOUNT STATS ===========
function renderStats(d) {
  const eq = d.equity || {};
  const sig = d.signals || {};
  const pos = d.positions || [];
  const initCap = eq.initial_capital || 10000;
  const curEquity = eq.equity != null ? eq.equity : initCap;
  const totalPnl = eq.total_pnl != null ? eq.total_pnl : 0;
  const totalTrades = (d.closed_trades_summary||{}).count || 0;
  const winCount = (d.closed_trades||[]).filter(t=>t.pnl>0).length;
  const winRate = totalTrades > 0 ? (winCount/totalTrades*100) : 0;

  // Daily P&L from capital_history
  const ch = d.capital_history || [];
  let dailyPnl = 0;
  if (ch.length > 1) {
    const todayStart = Date.now() - 86400000;
    let startVal = ch[0].e;
    for (let i = ch.length-1; i >= 0; i--) {
      if (ch[i].t < todayStart) { startVal = ch[i].e; break; }
    }
    dailyPnl = curEquity - startVal;
  }

  const pnlClr = totalPnl >= 0 ? '#0ecb81' : '#f6465d';
  const dayClr = dailyPnl >= 0 ? '#0ecb81' : '#f6465d';

  return '<div class="card"><div class="card-title">📊 账户总览</div><div class="stats-grid">'+
    '<div class="stat-card accent-equity"><div class="sv" style="color:#58a6ff">$'+Number(curEquity).toLocaleString('en-US',{minimumFractionDigits:2})+'</div><div class="sl">当前资金</div><div class="sc neutral">初始 $'+Number(initCap).toLocaleString()+'</div></div>'+
    '<div class="stat-card '+(totalPnl>=0?'accent-pnl':'accent-loss')+'"><div class="sv" style="color:'+pnlClr+'">'+pnlSign(totalPnl)+'$'+Math.abs(totalPnl).toLocaleString('en-US',{minimumFractionDigits:2})+'</div><div class="sl">总 P&L</div><div class="sc '+(totalPnl>=0?'positive':'negative')+'">'+(totalPnl>=0?'+':'')+((totalPnl/initCap*100)||0).toFixed(2)+'%</div></div>'+
    '<div class="stat-card accent-daily"><div class="sv" style="color:'+dayClr+'">'+pnlSign(dailyPnl)+'$'+Math.abs(dailyPnl).toLocaleString('en-US',{minimumFractionDigits:2})+'</div><div class="sl">日 P&L</div></div>'+
    '<div class="stat-card '+(winRate>=50?'accent-wr':'accent-loss')+'"><div class="sv" style="color:'+(winRate>=50?'#3fb950':'#f6465d')+'">'+winRate.toFixed(1)+'%</div><div class="sl">胜率</div><div class="sc neutral">'+totalTrades+' 笔交易</div></div>'+
    '<div class="stat-card accent-tr"><div class="sv" style="color:#f0883e">'+totalTrades+'</div><div class="sl">总交易</div><div class="sc neutral">'+(sig.total||0)+' 信号</div></div>'+
    '<div class="stat-card accent-pos"><div class="sv" style="color:#58a6ff">'+pos.length+'</div><div class="sl">持仓</div><div class="sc neutral">'+pos.filter(p=>p.side==='long').length+'多 · '+pos.filter(p=>p.side==='short').length+'空</div></div>'+
    '<div class="stat-card accent-sig"><div class="sv" style="color:#bc8cff">'+(sig.total||0)+'</div><div class="sl">信号</div><div class="sc neutral">'+(sig.botTotal?'Bot '+sig.botTotal:'')+'</div></div>'+
    '</div></div>';
}

// =========== RENDER CHART ===========
function renderChart(d) {
  const ch = d.capital_history || [];
  if (ch.length < 2) {
    return '<div class="card"><div class="card-title">📈 资金曲线</div><div class="chart-container"><canvas id="eqChart"></canvas></div></div>';
  }
  return '<div class="card"><div class="card-title">📈 资金曲线 <span style="font-weight:400;color:#484f58;font-size:10px">'+ch.length+' 个采样点</span></div><div class="chart-container"><canvas id="eqChart"></canvas></div></div>';
}

function drawChart(d) {
  const ch = d.capital_history || [];
  const canvas = document.getElementById('eqChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (ch.length < 2) {
    if (equityChart) { equityChart.destroy(); equityChart=null; }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#484f58'; ctx.font='13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('等待更多数据...',canvas.width/2,canvas.height/2);
    return;
  }
  const labels = ch.map(p=>new Date(p.t).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
  const data = ch.map(p=>p.e);
  const startVal = data[0];
  const endVal = data[data.length-1];
  const isUp = endVal >= startVal;
  const lineColor = isUp ? '#0ecb81' : '#f6465d';

  if (equityChart) {
    equityChart.data.labels = labels;
    equityChart.data.datasets[0].data = data;
    equityChart.data.datasets[0].borderColor = lineColor;
    equityChart.update('none');
    return;
  }
  equityChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '权益 ($)',
        data,
        borderColor: lineColor,
        backgroundColor: ctx2=>{
          const g=ctx2.chart.ctx.createLinearGradient(0,0,0,200);
          g.addColorStop(0, isUp ? 'rgba(14,203,129,0.2)' : 'rgba(246,70,93,0.2)');
          g.addColorStop(1, 'rgba(14,203,129,0.01)');
          return g;
        },
        fill: true, tension: 0.3, pointRadius: 0, pointHitRadius: 6, borderWidth: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1c2128', titleColor: '#8b949e', bodyColor: '#f0f6fc',
          borderColor: '#30363d', borderWidth: 1, padding: 6,
          callbacks: { label: ctx=>'$'+Number(ctx.raw).toLocaleString('en-US',{minimumFractionDigits:2}) }
        }
      },
      scales: {
        x: { display: true, grid: {color:'#21262d',drawBorder:false}, ticks: {color:'#484f58',font:{size:9},maxTicksLimit:8} },
        y: { display: true, grid: {color:'#21262d',drawBorder:false}, ticks: {color:'#484f58',font:{size:9},callback:v=>'$'+v.toLocaleString()} }
      }
    }
  });
}

// =========== RENDER SIGNAL TABLE ===========
function parseEdge(sigType) {
  const m = { 'longE':1.0,'shortE':-1.0,'longTP1':1.1,'shortTP1':-1.1,'longTP2':1.2,'shortTP2':-1.2,'longTP3':1.3,'shortTP3':-1.3,'longSL':0,'shortSL':0,'longX':0,'shortX':0,'none':0 };
  return m[sigType] || 0;
}

function signalAction(sigType) {
  if (sigType==='longE') return 'Buy YES';
  if (sigType==='shortE') return 'Buy NO';
  if (sigType==='longX'||sigType==='longTP1'||sigType==='longTP2'||sigType==='longTP3'||sigType==='longSL') return 'Sell YES';
  if (sigType==='shortX'||sigType==='shortTP1'||sigType==='shortTP2'||sigType==='shortTP3'||sigType==='shortSL') return 'Sell NO';
  return '—';
}

function renderSignals(d) {
  const sig = d.signals || {};
  const recent = sig.recent || [];

  // Sort signals by |edge| descending
  const sorted = [...recent].map(r=>({...r, edge: parseEdge(r.type), absEdge: Math.abs(parseEdge(r.type)) }));
  sorted.sort((a,b)=> signalSort.asc ? a.absEdge - b.absEdge : b.absEdge - a.absEdge);

  // Find max absEdge for scaling
  const maxAbs = sorted.length > 0 ? Math.max(...sorted.map(s=>s.absEdge), 0.1) : 1;

  let html = '<div class="card"><div class="card-title">📡 信号表 <span style="font-weight:400;color:#484f58;font-size:10px">共 '+(sig.total||0)+' 条</span></div>';
  if (sorted.length===0) {
    html += '<div class="empty-state"><div class="icon">📭</div><div class="text">暂无信号</div></div></div>';
    return html;
  }

  html += '<div class="scroll-wrap-sm"><table class="data-table"><thead><tr>'+
    '<th>时间</th><th>信号</th>'+
    '<th>YES价</th><th>建议动作</th>'+
    '<th class="sort-link" onclick="toggleSort()">边缘% ⬇</th>'+
    '<th>交易对</th>'+
  '</tr></thead><tbody>';

  for (const r of sorted) {
    const edge = r.edge;
    const absEdge = r.absEdge;
    const isHighlight = absEdge >= 0.15;
    const edgePct = (edge * 100).toFixed(1);
    const edgeColor = edge > 0 ? '#0ecb81' : (edge < 0 ? '#f6465d' : '#484f58');

    const action = signalAction(r.type);
    const actionCls = action.includes('YES') ? 'act-yes' : (action.includes('NO') ? 'act-no' : '');

    // YES price = signal price
    const yesPrice = r.price ? '$'+esc(r.price) : '—';

    html += '<tr class="sig-row-edge'+(isHighlight?' highlight':'')+'">'+
      '<td style="color:#8b949e;font-size:10px">'+fmtTime(r.time)+'</td>'+
      '<td><span class="sig-badge sig-'+r.type+'">'+esc(r.type)+'</span></td>'+
      '<td style="font-family:Consolas,monospace">'+yesPrice+'</td>'+
      '<td><span class="'+actionCls+'">'+action+'</span></td>'+
      '<td style="font-family:Consolas,monospace;font-weight:600;color:'+edgeColor+'">'+
        (isHighlight ? '<span class="edge-high-15">' : '') +
        (edge > 0 ? '+' : '') + edgePct + '%' +
        (isHighlight ? '</span>' : '') +
        '<div class="progress-bar" style="margin-top:2px;height:3px;width:60px">'+
        '<div class="progress-fill '+ (edge > 0 ? 'green' : 'red') + '" style="width:'+ (absEdge/maxAbs*100) +'%"></div></div>'+
      '</td>'+
      '<td>'+esc(r.symbol)+'</td>'+
    '</tr>';
  }

  html += '</tbody></table></div></div>';
  return html;
}

function toggleSort() {
  signalSort.asc = !signalSort.asc;
  refresh();
}

// =========== RENDER POSITIONS ===========
function calcDuration(entryTime) {
  if (!entryTime) return '—';
  const diff = Date.now() - new Date(entryTime).getTime();
  if (diff < 60000) return '<1m';
  if (diff < 3600000) return Math.floor(diff/60000)+'m';
  if (diff < 86400000) return Math.floor(diff/3600000)+'h';
  return Math.floor(diff/86400000)+'d';
}

function renderPositions(d) {
  const pos = d.positions || [];
  let html = '<div class="card"><div class="card-title">💼 持仓 <span style="font-weight:400;color:#6a7283;font-size:10px">'+pos.length+' 个</span></div>';
  if (pos.length===0) {
    html += '<div class="empty-state"><div class="icon">📦</div><div class="text">暂无持仓</div></div></div>';
    return html;
  }

  html += '<div class="scroll-wrap"><table class="data-table"><thead><tr>'+
    '<th>品种</th><th>方向</th><th>Shares</th><th>入场价</th><th>当前价</th><th>浮盈亏</th><th>时长</th><th>偏差</th><th>TP1/2/3</th>'+
  '</tr></thead><tbody>';

  for (const p of pos) {
    const dir = p.side === 'long' ? 'YES' : 'NO';
    const dirCls = p.side === 'long' ? 'dir-yes' : 'dir-no';

    const shares = p.size != null ? Number(p.size).toFixed(4) : '—';
    const entryStr = p.entry_price ? '$'+Number(p.entry_price).toFixed(p.entry_price<1?6:2) : '—';
    const curStr = p.current_price ? '$'+Number(p.current_price).toFixed(p.current_price<1?6:2) : '—';

    const pnl = p.pnl;
    let pnlStr = '—';
    if (pnl != null) {
      pnlStr = pnlSign(pnl)+'$'+Math.abs(pnl).toLocaleString('en-US',{minimumFractionDigits:2});
    }

    const dur = calcDuration(p.entry_time);

    // Deviation = (current - entry) / entry for long, (entry - current) / entry for short
    let dev = 0, devStr = '—';
    if (p.entry_price && p.entry_price > 0 && p.current_price && p.current_price > 0) {
      if (p.side === 'long') {
        dev = (Number(p.current_price) - Number(p.entry_price)) / Number(p.entry_price);
      } else {
        dev = (Number(p.entry_price) - Number(p.current_price)) / Number(p.entry_price);
      }
      devStr = (dev >= 0 ? '+' : '') + (dev*100).toFixed(2) + '%';
    }

    // TP
    const tp = p.tp_prices || [null,null,null];
    const tps = tp.map(v=> v && v>0 ? '$'+Number(v).toFixed(v<1?6:2) : '--').join(' / ');

    html += '<tr>'+
      '<td style="font-weight:600">'+esc(p.symbol)+'</td>'+
      '<td><span class="'+dirCls+'">'+dir+'</span></td>'+
      '<td style="font-family:Consolas,monospace">'+shares+'</td>'+
      '<td style="font-family:Consolas,monospace">'+entryStr+'</td>'+
      '<td style="font-family:Consolas,monospace">'+curStr+'</td>'+
      '<td style="font-family:Consolas,monospace;font-weight:600;'+pnlCls(pnl)+'">'+pnlStr+'</td>'+
      '<td style="color:#8b949e;font-size:10px">'+dur+'</td>'+
      '<td style="font-family:Consolas,monospace;font-weight:600;'+(dev>=0?'color:#0ecb81':'color:#f6465d')+'">'+devStr+'</td>'+
      '<td style="font-family:Consolas,monospace;font-size:10px;color:#6a7283">'+tps+'</td>'+
    '</tr>';
  }

  html += '</tbody></table></div></div>';
  return html;
}

// =========== RENDER MISC SECTIONS ===========
function renderMisc(d) {
  const sys = d.system;
  const syms = d.symbols || [];
  const ex = d.exchange;
  const procs = d.processes || [];

  let html = '';

  // Exchange
  if (ex) {
    html += '<div class="card"><div class="card-title">🔗 交易所</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
      '<div><div class="stat-row" style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:#8b949e;font-size:11px">网络</span><span style="font-weight:600;font-size:11px">'+esc(ex.network)+(ex.isTestnet?' 🟡':' 🔴')+'</span></div>'+
      '<div class="stat-row" style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:#8b949e;font-size:11px">模式</span><span style="font-weight:600;font-size:11px">'+(ex.dryRun?'模拟':'实盘')+' · '+(ex.leverage||'')+'x</span></div></div>'+
      '<div><div class="stat-row" style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:#8b949e;font-size:11px">状态</span><span style="font-weight:600;font-size:11px">'+(ex.status==='connected'?'🟢':'🔴')+' '+esc(ex.status)+'</span></div>'+
      '<div class="stat-row" style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:#8b949e;font-size:11px">账户</span><span style="font-size:10px;color:#8b949e">'+esc(ex.accountStatus)+'</span></div></div>'+
      '</div></div>';
  }

  // System
  if (sys) {
    const m=sys.memory||{}, dk=sys.disk||{}, c=sys.cpu||{};
    const mPct=m.usagePercent||0, dPct=dk.usagePercent||0;
    function barCol(p){ return p>80?'red':(p>60?'yellow':'green'); }
    html += '<div class="card"><div class="card-title">🖥️ 系统</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
      '<div><div style="font-size:16px;font-weight:700">'+mPct+'%</div><div style="font-size:10px;color:#6a7283">内存</div><div class="progress-bar" style="margin-top:4px"><div class="progress-fill '+barCol(mPct)+'" style="width:'+mPct+'%"></div></div></div>'+
      '<div><div style="font-size:16px;font-weight:700">'+dPct+'%</div><div style="font-size:10px;color:#6a7283">磁盘</div><div class="progress-bar" style="margin-top:4px"><div class="progress-fill '+barCol(dPct)+'" style="width:'+dPct+'%"></div></div></div>'+
      '</div></div>';
  }

  return html;
}

// =========== RENDER CLOSED TRADES ===========
function renderClosed(d) {
  const closed = d.closed_trades || [];
  const sum = d.closed_trades_summary || {count:0,total_closed_pnl:0};
  if (closed.length===0) return '';
  const totalPnl = sum.total_closed_pnl || 0;
  const pnlColor = totalPnl>=0?'#3fb950':'#f85149';
  const pp = totalPnl>0?'+':'';

  let html = '<div class="card"><div class="card-title">📜 历史平仓 <span style="font-weight:400;color:#484f58;font-size:10px">共 '+sum.count+' 笔 · 总盈亏 <span style="color:'+pnlColor+'">'+pp+'$'+Math.abs(totalPnl).toLocaleString('en-US',{minimumFractionDigits:2})+'</span></span></div>';

  html += '<div class="scroll-wrap-sm"><table class="data-table"><thead><tr>'+
    '<th>品种</th><th>方向</th><th>盈亏</th><th>归因</th><th>时间</th>'+
  '</tr></thead><tbody>';

  for (const t of closed.slice(-30).reverse()) {
    const side = t.side==='long'?'YES':'NO';
    const sideClr = t.side==='long'?'#0ecb81':'#f6465d';
    let pnlStr='—';
    if (t.pnl!=null) {
      const ps=t.pnl>0?'+':'';
      pnlStr='<span style="color:'+(t.pnl>=0?'#0ecb81':'#f6465d')+'">'+ps+'$'+Math.abs(t.pnl).toLocaleString('en-US',{minimumFractionDigits:2})+'</span>';
    }

    let attr='—';
    if (t.tp_order===1) attr='<span style="color:#0ecb81;font-weight:600">TP1</span>';
    else if (t.tp_order===2) attr='<span style="color:#0ecb81;font-weight:600">TP2</span>';
    else if (t.tp_order===3) attr='<span style="color:#0ecb81;font-weight:600">TP3</span>';
    else if (t.tp_order===0) attr='<span style="color:#f6465d;font-weight:600">SL</span>';

    html += '<tr><td style="font-weight:600">'+esc(t.symbol)+'</td>'+
      '<td><span style="color:'+sideClr+';font-weight:600">'+side+'</span></td>'+
      '<td style="text-align:right;font-weight:600">'+pnlStr+'</td>'+
      '<td style="text-align:center">'+attr+'</td>'+
      '<td style="color:#8b949e;font-size:10px">'+(t.close_time?fmtTime(t.close_time):'')+'</td></tr>';
  }

  html += '</tbody></table></div></div>';
  return html;
}

function renderFooter() {
  return '<div class="footer">LE VAN DO® · 每 '+FETCH_INTERVAL/1000+'s 刷新 · '+
    '<a href="/health" style="color:#58a6ff;text-decoration:none">/health</a> · '+
    '<a href="/api/status" style="color:#58a6ff;text-decoration:none">/api/status</a></div>';
}

// =========== MAIN ===========
function renderDashboard(d) {
  const h = renderHeader(d) + renderStats(d) + renderChart(d) + renderSignals(d) + renderPositions(d) + renderMisc(d) + renderClosed(d) + renderFooter();
  document.getElementById('app').innerHTML = h;
  drawChart(d);
}

async function refresh() {
  const d = await fetchData();
  if (!d) {
    document.getElementById('app').innerHTML =
      '<div class="container"><div class="empty-state" style="padding:60px 20px">'+
      '<div class="icon">⚠️</div><div class="text">无法连接服务器</div></div></div>';
    return;
  }
  document.getElementById('loading').style.display = 'none';
  renderDashboard(d);
  resetCountdown();
}

function resetCountdown() {
  countdownValue = FETCH_INTERVAL / 1000;
  updateCountdown();
}

function updateCountdown() {
  const el = document.getElementById('countdown');
  const bar = document.getElementById('refreshBarFill');
  if (el) el.textContent = countdownValue + 's';
  if (bar) bar.style.width = ((FETCH_INTERVAL/1000 - countdownValue) / (FETCH_INTERVAL/1000) * 100) + '%';
}

function startCountdown() {
  resetCountdown();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    countdownValue--;
    if (countdownValue <= 0) { countdownValue = FETCH_INTERVAL/1000; refresh(); }
    updateCountdown();
  }, 1000);
}

document.addEventListener('DOMContentLoaded', ()=>{ refresh(); startCountdown(); });
</script>
