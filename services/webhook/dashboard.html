<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌤️ HighTempTation 天气预测仪表板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0d1117; color: #c9d1d9; min-height: 100vh;
  }
  .container { max-width: 1440px; margin: 0 auto; padding: 16px 20px; }

  /* Header */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px; margin-bottom: 14px;
    background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
    border: 1px solid #30363d; border-radius: 12px; flex-wrap: wrap; gap: 8px;
  }
  .header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .logo { font-size: 18px; font-weight: 800; letter-spacing: 0.4px; color: #58a6ff; }
  .logo span { color: #f0883e; }
  .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 16px; font-size: 11px; font-weight: 600;
  }
  .status-pill.online { background: #1b3d2b; color: #3fb950; border: 1px solid #2ea043; }
  .status-pill.offline { background: #3d1b1b; color: #f85149; border: 1px solid #da3633; }
  .status-pill.dry-run { background: #1b2d3d; color: #58a6ff; border: 1px solid #1f6feb; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .status-dot.green { background: #3fb950; box-shadow: 0 0 4px #3fb950; }
  .status-dot.red { background: #f85149; box-shadow: 0 0 4px #f85149; }

  .refresh-bar { display: flex; align-items: center; gap: 6px; font-size: 10px; color: #484f58; }
  .refresh-bar .countdown { color: #8b949e; font-family: 'Consolas',monospace; min-width: 28px; text-align: center; }
  .refresh-bar .bar-track { width: 50px; height: 3px; background: #21262d; border-radius: 2px; overflow: hidden; }
  .refresh-bar .bar-fill { height: 100%; background: #58a6ff; border-radius: 2px; transition: width 0.3s linear; }

  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .card-title {
    font-size: 12px; font-weight: 600; color: #8b949e; text-transform: uppercase;
    letter-spacing: 0.3px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
  }

  /* Stats Grid */
  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) { .stats-grid { grid-template-columns: 1fr; } }
  .stat-card {
    background: linear-gradient(135deg, #1a1d29 0%, #161b22 100%);
    border: 1px solid #2d3343; border-radius: 8px; padding: 10px 12px;
    position: relative; overflow: hidden;
  }
  .stat-card .sv { font-size: 20px; font-weight: 700; font-family: 'Consolas', monospace; }
  .stat-card .sl { font-size: 10px; color: #6a7283; margin-top: 1px; text-transform: uppercase; letter-spacing: 0.2px; }
  .stat-card .sc { font-size: 11px; font-weight: 600; margin-top: 2px; }
  .positive { color: #0ecb81; }
  .negative { color: #f6465d; }
  .neutral { color: #8b949e; }

  .stat-card.accent-pnl { border-left: 3px solid #0ecb81; }
  .stat-card.accent-loss { border-left: 3px solid #f6465d; }
  .stat-card.accent-pos { border-left: 3px solid #58a6ff; }
  .stat-card.accent-winrate { border-left: 3px solid #d29922; }
  .stat-card.accent-trades { border-left: 3px solid #bc8cff; }
  .stat-card.accent-daily { border-left: 3px solid #f0883e; }

  /* Weather Position Card */
  .w-card {
    display: flex; align-items: center; flex-wrap: nowrap; gap: 8px;
    background: linear-gradient(135deg, #1a1d29 0%, #161b22 100%);
    border: 1px solid #2d3343; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 8px;
    transition: border-color 0.2s; font-size: 13px; min-height: 46px;
  }
  .w-card:hover { border-color: #58a6ff; }
  .w-card.pos-profit { border-left: 3px solid #0ecb81; }
  .w-card.pos-loss { border-left: 3px solid #f6465d; }
  .w-card.pos-flat { border-left: 3px solid #6a7283; }

  .w-card .wc-city { font-size: 14px; font-weight: 700; color: #f0f6fc; min-width: 80px; }
  .w-card .wc-bucket {
    font-size: 11px; font-weight: 600; color: #58a6ff;
    background: #1b2d3d; border-radius: 4px; padding: 2px 8px;
    border: 1px solid #1f6feb; min-width: 80px; text-align: center;
  }
  .w-card .wc-field {
    font-family: 'Consolas', monospace; white-space: nowrap;
    font-size: 12px; color: #f0f6fc; padding: 0 6px;
  }
  .w-card .wc-field .fl {
    font-size: 10px; color: #6a7283;
    font-family: 'Segoe UI', -apple-system, 'PingFang SC', sans-serif;
    display: block; margin-bottom: 1px;
  }
  .w-card .wc-field .fv { font-weight: 600; }
  .w-card .wc-field .fv.positive { color: #0ecb81; }
  .w-card .wc-field .fv.negative { color: #f6465d; }
  .w-card .wc-field .fv.muted { color: #6a7283; font-weight: 400; }
  .w-card .wc-field .fv.price-up { color: #0ecb81; }
  .w-card .wc-field .fv.price-down { color: #f6465d; }
  .w-card .wc-sep { width: 1px; height: 32px; background: #2d3343; flex-shrink: 0; }

  /* Data table */
  .data-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .data-table th {
    text-align: left; padding: 6px 8px; border-bottom: 2px solid #30363d;
    color: #8b949e; font-weight: 600; font-size: 10px; text-transform: uppercase; white-space: nowrap;
  }
  .data-table td { padding: 5px 8px; border-bottom: 1px solid #21262d; white-space: nowrap; }
  .data-table tr:hover td { background: #1c2128; }

  .scroll-wrap { max-height: 360px; overflow-y: auto; }

  /* Forecast cards */
  .fc-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px;
  }
  .fc-cell {
    padding: 8px 10px; border-radius: 6px; font-size: 11px;
    text-align: center; border: 1px solid #21262d;
    background: #1a1d29; transition: all 0.2s;
  }
  .fc-cell .fc-city { display: block; font-weight: 700; color: #f0f6fc; }
  .fc-cell .fc-temp { display: block; font-size: 14px; color: #58a6ff; margin-top: 2px; }
  .fc-cell .fc-sigma { display: block; font-size: 10px; color: #6a7283; }

  /* Progress bars */
  .progress-bar { height: 5px; background: #21262d; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
  .progress-fill.green { background: linear-gradient(90deg,#2ea043,#3fb950); }
  .progress-fill.blue { background: linear-gradient(90deg,#1f6feb,#58a6ff); }
  .progress-fill.red { background: linear-gradient(90deg,#da3633,#f85149); }
  .progress-fill.yellow { background: linear-gradient(90deg,#bb8009,#d29922); }

  .empty-state { text-align: center; padding: 24px 12px; color: #484f58; }
  .empty-state .icon { font-size: 26px; margin-bottom: 4px; }
  .empty-state .text { font-size: 12px; }

  .loading { text-align: center; padding: 40px; color: #8b949e; }
  .loading .spinner {
    width: 28px; height: 28px; border: 3px solid #21262d;
    border-top-color: #58a6ff; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer {
    text-align: center; padding: 14px; color: #484f58; font-size: 10px;
    border-top: 1px solid #21262d; margin-top: 28px;
  }

  /* Exit reason badges */
  .er-badge {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-size: 9px; font-weight: 700;
  }
  .er-TP { background: #0d2818; color: #3fb950; }
  .er-SL { background: #2d1215; color: #f85149; }
  .er-Trailing { background: #1b2d3d; color: #58a6ff; }
  .er-Settlement { background: #2d1b0e; color: #d29922; }

  .db-status { font-size: 10px; color: #484f58; }
  .db-status.ok { color: #3fb950; }
  .db-status.missing { color: #f85149; }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>加载天气预测仪表板...</div>
  </div>
</div>

<script>
const FETCH_INTERVAL = 15000;
let pnlChart = null;
let refreshTimer = null;
let countdownValue = FETCH_INTERVAL / 1000;

function $(s) { return document.querySelector(s); }

function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function pnlCls(v) { return v == null ? '' : (v > 0 ? 'positive' : (v < 0 ? 'negative' : '')); }
function pnlSign(v) { return v == null ? '' : (v > 0 ? '+' : ''); }

function fmtBucket(low, high) {
  if (low == null || high == null) return '—';
  return Number(low).toFixed(1) + '°C ~ ' + Number(high).toFixed(1) + '°C';
}

function shortBucket(low, high) {
  if (low == null || high == null) return '—';
  return Number(low).toFixed(1) + '-' + Number(high).toFixed(0) + '°C';
}

async function fetchData() {
  try {
    const r = await fetch('/api/status');
    if (!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } catch(e) { return null; }
}

// =========== HEADER ===========
function renderHeader(d) {
  const w = d.weather;
  const dbOk = w && w.db_exists;
  const wStats = w && w.summary;
  const openCount = wStats ? wStats.open_count : 0;
  const totalPnl = wStats ? wStats.total_pnl : 0;

  return '<div class="header"><div class="header-left">'+
    '<div class="logo">🌤️ HighTemp<span>Tation</span></div>'+
    '<span class="status-pill '+(dbOk?'online':'offline')+'">'+
      '<span class="status-dot '+(dbOk?'green':'red')+'"></span>'+
      (dbOk ? 'DB 连接正常' : 'DB 离线')+
    '</span>'+
    '<span class="status-pill '+(openCount>0?'online':'offline')+'">'+
      '<span class="status-dot '+(openCount>0?'green':'red')+'"></span>'+
      openCount+' 持仓'+
    '</span>'+
    '</div><div class="header-right">'+
    '<div class="refresh-bar"><span class="countdown" id="countdown">'+countdownValue+'s</span>'+
    '<div class="bar-track"><div class="bar-fill" id="refreshBarFill"></div></div></div>'+
    '<span style="font-size:10px;color:#8b949e">⬆ '+(d.server?d.server.uptime:'--')+'</span>'+
    '<span style="font-size:10px;color:#484f58">'+(d.server?fmtTime(d.server.time):'')+'</span>'+
    '</div></div>';
}

// =========== SUMMARY STATS ===========
function renderStats(d) {
  const w = d.weather;
  const wDaily = w ? w.daily : null;
  const wStats = w ? w.summary : null;

  const totalPnl = wStats ? wStats.total_pnl : 0;
  const openCount = wStats ? wStats.open_count : 0;
  const totalTrades = wStats ? wStats.total_trades : 0;
  const equity = wStats ? wStats.equity : 10000;

  const dailyPnl = wDaily ? (wDaily.total_pnl || 0) : 0;
  const dailyWins = wDaily ? (wDaily.wins || 0) : 0;
  const dailyLosses = wDaily ? (wDaily.losses || 0) : 0;
  const dailyCount = wDaily ? (wDaily.count || 0) : 0;
  const winRate = dailyCount > 0 ? ((dailyWins / dailyCount) * 100).toFixed(1) : '0.0';

  const pnlColor = totalPnl >= 0 ? '#0ecb81' : '#f6465d';
  const dayColor = dailyPnl >= 0 ? '#0ecb81' : '#f6465d';

  return '<div class="card"><div class="card-title">📊 账户总览</div><div class="stats-grid">'+
    '<div class="stat-card accent-pos"><div class="sv" style="color:#58a6ff">$'+Number(equity).toLocaleString('en-US',{minimumFractionDigits:2})+'</div><div class="sl">当前资金</div><div class="sc neutral">初始 $10,000.00</div></div>'+
    '<div class="stat-card '+(totalPnl>=0?'accent-pnl':'accent-loss')+'"><div class="sv" style="color:'+pnlColor+'">'+pnlSign(totalPnl)+'$'+Math.abs(totalPnl).toLocaleString('en-US',{minimumFractionDigits:2})+'</div><div class="sl">总 P&L</div><div class="sc '+(totalPnl>=0?'positive':'negative')+'">'+(totalPnl>=0?'+':'')+((totalPnl/10000*100)||0).toFixed(2)+'%</div></div>'+
    '<div class="stat-card accent-daily"><div class="sv" style="color:'+dayColor+'">'+pnlSign(dailyPnl)+'$'+Math.abs(dailyPnl).toLocaleString('en-US',{minimumFractionDigits:2})+'</div><div class="sl">日 P&L</div><div class="sc neutral">'+dailyCount+' 笔交易</div></div>'+
    '<div class="stat-card accent-winrate"><div class="sv" style="color:#d29922">'+winRate+'%</div><div class="sl">日胜率</div><div class="sc neutral">'+dailyWins+'胜 / '+dailyLosses+'负</div></div>'+
    '<div class="stat-card accent-trades"><div class="sv" style="color:#bc8cff">'+totalTrades+'</div><div class="sl">累计交易</div></div>'+
    '<div class="stat-card accent-pos"><div class="sv" style="color:#58a6ff">'+openCount+'</div><div class="sl">当前持仓</div></div>'+
    '<div class="stat-card '+(dailyWins>=dailyLosses||dailyCount===0?'accent-pnl':'accent-loss')+'"><div class="sv" style="color:'+(dailyWins>=dailyLosses||dailyCount===0?'#0ecb81':'#f6465d')+'">'+(wDaily?'$'+Number(Math.abs(dailyPnl/dailyCount||0)).toFixed(2):'$0.00')+'</div><div class="sl">均笔盈亏</div></div>'+
    '<div class="stat-card" style="border-left:3px solid #58a6ff"><div class="sv" style="font-size:14px;color:#8b949e">'+(d.server?fmtTime(d.server.time):'')+'</div><div class="sl">最后更新</div></div>'+
    '</div></div>';
}

// =========== WEATHER FORECASTS ===========
function renderForecasts(d) {
  const w = d.weather;
  if (!w || !w.forecasts || w.forecasts.length === 0) {
    return '<div class="card"><div class="card-title">🌡️ 城市预报</div><div class="empty-state"><div class="icon">🌤️</div><div class="text">暂无预报数据</div></div></div>';
  }

  let html = '<div class="card"><div class="card-title">🌡️ 城市预报 <span style="font-weight:400;color:#484f58;font-size:10px">'+w.forecasts.length+' 个城市</span></div><div class="fc-grid">';

  for (const fc of w.forecasts) {
    const tempStr = fc.mu != null ? fc.mu.toFixed(1) + '°C' : '--';
    const sigmaStr = fc.sigma != null ? 'σ=' + fc.sigma.toFixed(1) : '';
    html += '<div class="fc-cell">'+
      '<span class="fc-city">'+esc(fc.city)+'</span>'+
      '<span class="fc-temp">'+tempStr+'</span>'+
      '<span class="fc-sigma">'+sigmaStr+'</span>'+
    '</div>';
  }

  html += '</div></div>';
  return html;
}

// =========== OPEN POSITIONS ===========
function renderOpenPositions(d) {
  const w = d.weather;
  const positions = (w && w.open_positions) || [];

  let html = '<div class="card"><div class="card-title">💼 持仓 <span style="font-weight:400;color:#6a7283;font-size:10px">'+
    positions.length+' 个</span></div>';

  if (positions.length === 0) {
    html += '<div class="empty-state"><div class="icon">📦</div><div class="text">暂无持仓</div></div></div>';
    return html;
  }

  for (const p of positions) {
    const entryNo = p.entry_no != null ? Number(p.entry_no) : 0;
    const currNo = p.curr_no != null ? Number(p.curr_no) : entryNo;
    const pnl = p.pnl != null ? Number(p.pnl) : ((entryNo - currNo) * (p.size || 0));
    const pnlPct = entryNo > 0 ? ((entryNo - currNo) / entryNo * 100) : 0;

    const isProfit = pnl >= 0;
    const posClass = isProfit ? 'pos-profit' : (pnl < 0 ? 'pos-loss' : 'pos-flat');

    html += '<div class="w-card '+posClass+'">'+
      '<span class="wc-city">'+esc(p.city)+'</span>'+
      '<span class="wc-bucket">'+shortBucket(p.bucket_lower, p.bucket_upper)+'</span>'+
      '<span class="wc-sep"></span>'+
      '<span class="wc-field"><span class="fl">入场 NO</span><span class="fv">$'+entryNo.toFixed(4)+'</span></span>'+
      '<span class="wc-field"><span class="fl">当前 NO</span><span class="fv '+(currNo <= entryNo ? 'price-up' : 'price-down')+'">$'+currNo.toFixed(4)+'</span></span>'+
      '<span class="wc-sep"></span>'+
      '<span class="wc-field" style="min-width:70px"><span class="fl">盈亏</span><span class="fv '+pnlCls(pnl)+'">'+pnlSign(pnl)+'$'+Math.abs(pnl).toFixed(2)+'</span></span>'+
      '<span class="wc-field" style="min-width:60px"><span class="fl">收益率</span><span class="fv '+(pnlPct>0?'positive':'negative')+'">'+(pnlPct>=0?'+':'')+pnlPct.toFixed(2)+'%</span></span>'+
      '<span class="wc-sep"></span>'+
      '<span class="wc-field"><span class="fl">数量</span><span class="fv muted">'+(p.size != null ? p.size.toFixed(4) : '—')+'</span></span>'+
      '<span class="wc-field"><span class="fl">开仓</span><span class="fv muted">'+fmtTime(p.entry_time)+'</span></span>'+
    '</div>';
  }

  html += '</div>';
  return html;
}

// =========== CLOSED TRADES ===========
function renderClosedTrades(d) {
  const w = d.weather;
  const closed = (w && w.closed_trades) || [];
  const wDaily = w ? w.daily : null;
  const wStats = w ? w.summary : null;

  const totalPnl = wStats ? wStats.total_pnl : 0;
  const pnlColor = totalPnl >= 0 ? '#3fb950' : '#f85149';

  if (closed.length === 0) {
    return '<div class="card"><div class="card-title">📜 平仓记录</div><div class="empty-state"><div class="icon">📭</div><div class="text">暂无平仓记录</div></div></div>';
  }

  let html = '<div class="card"><div class="card-title">📜 平仓记录 <span style="font-weight:400;color:#484f58;font-size:10px">最近 '+closed.length+' 笔·总盈亏 <span style="color:'+pnlColor+'">'+pnlSign(totalPnl)+'$'+Math.abs(totalPnl).toFixed(2)+'</span></span></div>';

  html += '<div class="scroll-wrap"><table class="data-table"><thead><tr>'+
    '<th>城市</th><th>桶</th><th>入场 NO</th><th>平仓价</th><th>盈亏</th><th>收益率</th><th>归因</th><th>时间</th>'+
  '</tr></thead><tbody>';

  for (const t of closed) {
    const pnl = t.pnl != null ? t.pnl : 0;
    const entryNo = t.entry_no != null ? t.entry_no : 0;
    const exitPrice = t.exit_price != null ? t.exit_price : 0;
    const returnPct = entryNo > 0 ? ((entryNo - exitPrice) / entryNo * 100) : 0;

    // Exit reason badge
    const reason = t.exit_reason || '';
    let reasonBadge = '—';
    if (reason === 'TP') reasonBadge = '<span class="er-badge er-TP">TP</span>';
    else if (reason === 'SL') reasonBadge = '<span class="er-badge er-SL">SL</span>';
    else if (reason === 'Trailing') reasonBadge = '<span class="er-badge er-Trailing">Trailing</span>';
    else if (reason === 'Settlement' || reason === 'ForceStop') reasonBadge = '<span class="er-badge er-Settlement">'+esc(reason)+'</span>';
    else if (reason) reasonBadge = '<span class="er-badge" style="background:#1c1c1c;color:#8b949e">'+esc(reason)+'</span>';

    html += '<tr>'+
      '<td style="font-weight:600">'+esc(t.city)+'</td>'+
      '<td style="color:#58a6ff">'+shortBucket(t.bucket_lower, t.bucket_upper)+'</td>'+
      '<td style="font-family:Consolas,monospace">$'+Number(entryNo).toFixed(4)+'</td>'+
      '<td style="font-family:Consolas,monospace">$'+Number(exitPrice).toFixed(4)+'</td>'+
      '<td style="font-family:Consolas,monospace;font-weight:600;'+pnlCls(pnl)+'">'+pnlSign(pnl)+'$'+Math.abs(pnl).toFixed(2)+'</td>'+
      '<td style="font-family:Consolas,monospace;font-weight:600;'+(returnPct>=0?'color:#0ecb81':'color:#f6465d')+'">'+(returnPct>=0?'+':'')+returnPct.toFixed(2)+'%</td>'+
      '<td style="text-align:center">'+reasonBadge+'</td>'+
      '<td style="color:#8b949e;font-size:10px">'+fmtTime(t.exit_time || t.entry_time)+'</td>'+
    '</tr>';
  }

  html += '</tbody></table></div></div>';
  return html;
}

// =========== SYSTEM INFO ===========
function renderSystem(d) {
  const sys = d.system;
  if (!sys) return '';

  const mem = sys.memory || {};
  const disk = sys.disk || {};
  const cpu = sys.cpu || {};
  const memPct = mem.usagePercent || 0;
  const diskPct = disk.usagePercent || 0;
  const barCol = p => p>80?'red':(p>60?'yellow':'green');

  let html = '<div class="card"><div class="card-title">🖥️ 系统 <span style="font-weight:400;color:#484f58;font-size:10px">'+esc(sys.hostname)+'</span></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">'+
    '<div><div style="font-size:16px;font-weight:700">'+memPct+'%</div><div style="font-size:10px;color:#6a7283">内存</div><div class="progress-bar" style="margin-top:4px"><div class="progress-fill '+barCol(memPct)+'" style="width:'+memPct+'%"></div></div></div>'+
    '<div><div style="font-size:16px;font-weight:700">'+diskPct+'%</div><div style="font-size:10px;color:#6a7283">磁盘</div><div class="progress-bar" style="margin-top:4px"><div class="progress-fill '+barCol(diskPct)+'" style="width:'+diskPct+'%"></div></div></div>'+
    '<div><div style="font-size:16px;font-weight:700">'+cpu.cores+'</div><div style="font-size:10px;color:#6a7283">CPU 核心</div><div style="font-size:10px;color:#8b949e;margin-top:4px">负载: '+((cpu.loadAvg||[]).map(v=>v.toFixed(1)).join(' / ')||'—')+'</div></div>'+
    '</div></div>';

  return html;
}

function renderFooter() {
  return '<div class="footer">🌤️ HighTempTation 天气预测交易机器人 · 每 '+FETCH_INTERVAL/1000+'s 刷新 · '+
    '<a href="/api/status" style="color:#58a6ff;text-decoration:none">API</a></div>';
}

// =========== MAIN ===========
function renderDashboard(d) {
  const h = renderHeader(d) + renderStats(d) + renderForecasts(d) + renderOpenPositions(d) + renderClosedTrades(d) + renderSystem(d) + renderFooter();
  document.getElementById('app').innerHTML = h;
}

async function refresh() {
  const d = await fetchData();
  if (!d || !d.weather) {
    // Check if we have any data at all
    if (!d) {
      document.getElementById('app').innerHTML =
        '<div class="container"><div class="empty-state" style="padding:60px 20px">'+
        '<div class="icon">⚠️</div><div class="text">无法连接服务器</div></div></div>';
    } else {
      document.getElementById('app').innerHTML =
        '<div class="container">'+
        renderHeader(d) +
        '<div class="card"><div class="card-title">🌤️ 天气数据</div>'+
        '<div class="empty-state"><div class="icon">📡</div><div class="text">天气预测数据库未连接</div>'+
        '<p style="color:#8b949e;font-size:11px;margin-top:6px">请确认 HighTempTation bot 已运行，SQLite DB 可访问</p></div></div>'+
        renderSystem(d) + renderFooter() + '</div>';
    }
    return;
  }
  document.getElementById('loading').style.display = 'none';
  renderDashboard(d);
  resetCountdown();
}

function resetCountdown() {
  countdownValue = FETCH_INTERVAL / 1000;
  updateCountdown();
}

function updateCountdown() {
  const el = document.getElementById('countdown');
  const bar = document.getElementById('refreshBarFill');
  if (el) el.textContent = countdownValue + 's';
  if (bar) bar.style.width = ((FETCH_INTERVAL/1000 - countdownValue) / (FETCH_INTERVAL/1000) * 100) + '%';
}

function startCountdown() {
  resetCountdown();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    countdownValue--;
    if (countdownValue <= 0) { countdownValue = FETCH_INTERVAL/1000; refresh(); }
    updateCountdown();
  }, 1000);
}

document.addEventListener('DOMContentLoaded', ()=>{ refresh(); startCountdown(); });
</script>
</body>
</html>
