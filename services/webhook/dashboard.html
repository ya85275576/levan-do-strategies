<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LE VAN DO® 交易仪表板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0d1117; color: #c9d1d9; min-height: 100vh;
  }
  .container { max-width: 1440px; margin: 0 auto; padding: 16px 20px; }

  /* Header */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; margin-bottom: 16px;
    background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
    border: 1px solid #30363d; border-radius: 12px; flex-wrap: wrap; gap: 10px;
  }
  .header-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .logo { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; color: #58a6ff; }
  .logo span { color: #f0883e; }
  .header-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
  }
  .status-pill.online { background: #1b3d2b; color: #3fb950; border: 1px solid #2ea043; }
  .status-pill.offline { background: #3d1b1b; color: #f85149; border: 1px solid #da3633; }
  .status-pill.dry-run { background: #1b2d3d; color: #58a6ff; border: 1px solid #1f6feb; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .status-dot.green { background: #3fb950; box-shadow: 0 0 5px #3fb950; }
  .status-dot.red { background: #f85149; box-shadow: 0 0 5px #f85149; }
  .status-dot.blue { background: #58a6ff; box-shadow: 0 0 5px #58a6ff; }

  /* Auto-refresh countdown */
  .refresh-bar {
    display: flex; align-items: center; gap: 8px; font-size: 11px; color: #484f58;
  }
  .refresh-bar .countdown { color: #8b949e; font-family: 'Consolas', monospace; min-width: 32px; text-align: center; }
  .refresh-bar .bar-track { width: 60px; height: 4px; background: #21262d; border-radius: 2px; overflow: hidden; }
  .refresh-bar .bar-fill { height: 100%; background: #58a6ff; border-radius: 2px; transition: width 0.3s linear; }

  /* Cards */
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    padding: 16px 18px; margin-bottom: 16px;
  }
  .card-title {
    font-size: 13px; font-weight: 600; color: #8b949e; text-transform: uppercase;
    letter-spacing: 0.4px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }

  /* Account stat cards — fixed grid */
  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
  }
  @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) { .stats-grid { grid-template-columns: 1fr; } }
  .stat-card {
    background: linear-gradient(135deg, #1a1d29 0%, #161b22 100%);
    border: 1px solid #2d3343; border-radius: 10px; padding: 14px 16px;
    position: relative; overflow: hidden;
  }
  .stat-card .stat-icon { font-size: 22px; margin-bottom: 6px; }
  .stat-card .stat-value { font-size: 26px; font-weight: 700; font-family: 'Consolas', monospace; }
  .stat-card .stat-label { font-size: 11px; color: #6a7283; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.3px; }
  .stat-card .stat-change { font-size: 12px; font-weight: 600; margin-top: 4px; }
  .stat-card .stat-change.positive { color: #0ecb81; }
  .stat-card .stat-change.negative { color: #f6465d; }
  .stat-card.accent-equity { border-left: 3px solid #58a6ff; }
  .stat-card.accent-pnl { border-left: 3px solid #0ecb81; }
  .stat-card.accent-positions { border-left: 3px solid #d29922; }
  .stat-card.accent-signals { border-left: 3px solid #f0883e; }

  /* Grid helpers */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 900px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

  /* Equity chart */
  .chart-container { position: relative; height: 240px; width: 100%; }

  /* Stat rows */
  .stat-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #21262d; }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .label { color: #8b949e; font-size: 12px; }
  .stat-row .value { font-weight: 600; font-size: 12px; font-family: 'Consolas', monospace; }

  /* Symbol grid */
  .symbol-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 5px;
  }
  .symbol-cell {
    padding: 5px 7px; border-radius: 5px; font-size: 10px; font-weight: 500;
    text-align: center; border: 1px solid #21262d; transition: all 0.2s;
  }
  .symbol-cell.ok { background: #0d2818; border-color: #2ea043; color: #3fb950; }
  .symbol-cell.no_data { background: #1c1c1c; border-color: #30363d; color: #484f58; }
  .symbol-cell.error { background: #2d1215; border-color: #da3633; color: #f85149; }
  .symbol-cell .sym-name { display: block; }
  .symbol-cell .sym-price { font-size: 9px; opacity: 0.7; display: block; margin-top: 1px; }

  /* Signal table */
  .signal-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .signal-table th {
    text-align: left; padding: 8px 10px; border-bottom: 2px solid #30363d;
    color: #8b949e; font-weight: 600; font-size: 11px; text-transform: uppercase; white-space: nowrap;
  }
  .signal-table td { padding: 6px 10px; border-bottom: 1px solid #21262d; white-space: nowrap; }
  .signal-table tr:hover td { background: #1c2128; }
  .signal-table .sort-link { cursor: pointer; color: #58a6ff; }
  .signal-table .sort-link:hover { text-decoration: underline; }
  .signal-type {
    display: inline-block; padding: 2px 7px; border-radius: 4px;
    font-size: 10px; font-weight: 700; font-family: 'Consolas', monospace;
  }
  .sig-longE { background: #0d2818; color: #3fb950; }
  .sig-shortE { background: #2d1215; color: #f85149; }
  .sig-longX { background: #1b2d3d; color: #58a6ff; }
  .sig-shortX { background: #2d1b0e; color: #d29922; }
  .sig-longTP1, .sig-longTP2, .sig-longTP3 { background: #0d2818; color: #7ee787; }
  .sig-shortTP1, .sig-shortTP2, .sig-shortTP3 { background: #2d1215; color: #ffa198; }
  .sig-longSL, .sig-shortSL { background: #3d1b1b; color: #f85149; }

  /* Progress bars */
  .progress-bar { height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
  .progress-fill.green { background: linear-gradient(90deg, #2ea043, #3fb950); }
  .progress-fill.blue { background: linear-gradient(90deg, #1f6feb, #58a6ff); }
  .progress-fill.red { background: linear-gradient(90deg, #da3633, #f85149); }
  .progress-fill.yellow { background: linear-gradient(90deg, #bb8009, #d29922); }

  /* Process cards */
  .process-card {
    padding: 12px; border-radius: 8px; border: 1px solid #21262d;
    display: flex; justify-content: space-between; align-items: center;
  }
  .process-name { font-weight: 600; font-size: 13px; }
  .process-meta { font-size: 11px; color: #8b949e; margin-top: 3px; }
  .process-stats { text-align: right; }
  .process-stats .cpu-mem { font-size: 11px; color: #8b949e; }

  /* Signal counts */
  .signal-counts { display: flex; gap: 10px; flex-wrap: wrap; }
  .signal-count-item {
    padding: 10px 14px; border-radius: 8px; border: 1px solid #21262d;
    text-align: center; min-width: 80px;
  }
  .signal-count-item .sc-value { font-size: 22px; font-weight: 700; }
  .signal-count-item .sc-label { font-size: 10px; color: #8b949e; margin-top: 2px; }

  /* Position cards — full fields */
  .pos-card {
    display: flex; align-items: center; flex-wrap: nowrap; gap: 6px;
    background: linear-gradient(135deg, #1a1d29 0%, #161b22 100%);
    border: 1px solid #2d3343; border-radius: 10px;
    padding: 8px 12px; margin-bottom: 6px;
    transition: border-color 0.2s; font-size: 12px; min-height: 42px;
    overflow-x: auto;
  }
  .pos-card:hover { border-color: #58a6ff; }
  .pos-card.long { border-left: 3px solid #0ecb81; }
  .pos-card.short { border-left: 3px solid #f6465d; }
  .pos-card .pf { font-family: 'Consolas', monospace; white-space: nowrap; font-size: 11px; color: #f0f6fc; padding: 0 3px; }
  .pos-card .pf .fl { font-size: 9px; color: #6a7283; font-family: 'Segoe UI', sans-serif; display: block; margin-bottom: 1px; }
  .pos-card .pf .fv { font-weight: 600; }
  .pos-card .pf .fv.positive { color: #0ecb81; }
  .pos-card .pf .fv.negative { color: #f6465d; }
  .pos-card .pf .fv.muted { color: #6a7283; font-weight: 400; }
  .pos-card .sep { width: 1px; height: 28px; background: #2d3343; flex-shrink: 0; }
  .pos-card .pos-symbol { font-size: 13px; font-weight: 700; color: #f0f6fc; min-width: 80px; }
  .pos-card .pos-lev {
    font-size: 10px; font-weight: 700; color: #8b949e;
    background: #2d3343; border-radius: 3px; padding: 1px 5px;
    border: 1px solid #3d4353; min-width: 34px; text-align: center;
  }
  .pos-card .pos-side {
    font-size: 10px; font-weight: 700; border-radius: 3px; padding: 1px 7px;
    min-width: 32px; text-align: center;
  }
  .pos-card .pos-side.long { color: #0ecb81; background: #0ecb8115; }
  .pos-card .pos-side.short { color: #f6465d; background: #f6465d15; }
  .pos-card .pos-cond {
    font-size: 10px; padding: 1px 5px; border-radius: 3px;
    background: #1b2d3d; color: #58a6ff; border: 1px solid #1f6feb; font-weight: 600;
  }

  /* Risk exposure */
  .risk-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 700px) { .risk-grid { grid-template-columns: 1fr; } }
  .risk-item {
    background: #1a1d29; border: 1px solid #2d3343; border-radius: 8px;
    padding: 12px 14px; text-align: center;
  }
  .risk-item .ri-value { font-size: 22px; font-weight: 700; font-family: 'Consolas', monospace; }
  .risk-item .ri-label { font-size: 10px; color: #6a7283; margin-top: 3px; text-transform: uppercase; }

  /* Empty state */
  .empty-state { text-align: center; padding: 30px 16px; color: #484f58; }
  .empty-state .icon { font-size: 30px; margin-bottom: 6px; }
  .empty-state .text { font-size: 13px; }

  /* Loading */
  .loading { text-align: center; padding: 50px; color: #8b949e; }
  .loading .spinner {
    width: 32px; height: 32px; border: 3px solid #21262d;
    border-top-color: #58a6ff; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Footer */
  .footer {
    text-align: center; padding: 16px; color: #484f58; font-size: 11px;
    border-top: 1px solid #21262d; margin-top: 32px;
  }

  /* Responsive tweaks */
  @media (max-width: 1100px) {
    .pos-card { flex-wrap: wrap; min-height: auto; padding: 8px; }
    .pos-card .sep { display: none; }
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>加载仪表板数据...</div>
  </div>
</div>

<script>
// ======== CONSTANTS ========
const FETCH_INTERVAL = 30000;  // 30s
const EQUITY_HISTORY_KEY = 'led_equity_history';
const MAX_EQUITY_POINTS = 200;

let equityChart = null;
let refreshTimer = null;
let countdownValue = FETCH_INTERVAL / 1000;

// ======== UTILITY ========
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function fmtBytes(b) {
  if (b === 0) return '0 B';
  const u = ['B','KB','MB','GB','TB'];
  const i = Math.floor(Math.log(b) / Math.log(1024));
  return (b / Math.pow(1024, i)).toFixed(1) + ' ' + u[i];
}

function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function pnlCls(v) { return v == null ? '' : (v > 0 ? 'positive' : (v < 0 ? 'negative' : '')); }
function pnlSign(v) { return v == null ? '' : (v > 0 ? '+' : ''); }

function fmtPrice(v) {
  if (v == null || v <= 0) return null;
  const n = Number(v);
  return n < 1 ? n.toFixed(6) : n.toFixed(2);
}

// ======== EQUITY HISTORY (localStorage) ========
function loadEquityHistory() {
  try {
    const raw = localStorage.getItem(EQUITY_HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}

function saveEquityHistory(data) {
  try {
    localStorage.setItem(EQUITY_HISTORY_KEY, JSON.stringify(data));
  } catch {}
}

function addEquityPoint(equity, timestamp) {
  const history = loadEquityHistory();
  // Deduplicate by same timestamp minute
  const last = history[history.length - 1];
  if (last && Math.abs(last.t - timestamp) < 2000) return history; // skip within 2s
  history.push({ e: equity, t: timestamp });
  if (history.length > MAX_EQUITY_POINTS) history.splice(0, history.length - MAX_EQUITY_POINTS);
  saveEquityHistory(history);
  return history;
}

// ======== CHART.JS EQUITY CURVE ========
function renderEquityChart(equityHistory, currentEquity) {
  const canvas = document.getElementById('equityChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  // Add current point if not dupe
  if (currentEquity != null) {
    const now = Date.now();
    const history = addEquityPoint(currentEquity, now);
    equityHistory = history;
  }

  if (!equityHistory || equityHistory.length < 2) {
    // No enough data — show placeholder
    if (equityChart) { equityChart.destroy(); equityChart = null; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#484f58';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('等待更多数据绘制权益曲线...', canvas.width / 2, canvas.height / 2);
    return;
  }

  const labels = equityHistory.map(p => new Date(p.t).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }));
  const data = equityHistory.map(p => p.e);

  if (equityChart) {
    equityChart.data.labels = labels;
    equityChart.data.datasets[0].data = data;
    equityChart.update('none');
    return;
  }

  const initVal = data[0];
  const isUp = data[data.length - 1] >= initVal;

  equityChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '权益 ($)',
        data,
        borderColor: isUp ? '#0ecb81' : '#f6465d',
        backgroundColor: (ctx) => {
          const grad = ctx.chart.ctx.createLinearGradient(0, 0, 0, 240);
          if (isUp) {
            grad.addColorStop(0, 'rgba(14, 203, 129, 0.25)');
            grad.addColorStop(1, 'rgba(14, 203, 129, 0.02)');
          } else {
            grad.addColorStop(0, 'rgba(246, 70, 93, 0.25)');
            grad.addColorStop(1, 'rgba(246, 70, 93, 0.02)');
          }
          return grad;
        },
        fill: true,
        tension: 0.3,
        pointRadius: 0,
        pointHitRadius: 8,
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1c2128',
          titleColor: '#8b949e',
          bodyColor: '#f0f6fc',
          borderColor: '#30363d',
          borderWidth: 1,
          padding: 8,
          callbacks: {
            label: (ctx) => '$' + Number(ctx.raw).toLocaleString('en-US', { minimumFractionDigits: 2 })
          }
        }
      },
      scales: {
        x: {
          display: true,
          grid: { color: '#21262d', drawBorder: false },
          ticks: { color: '#484f58', font: { size: 10 }, maxTicksLimit: 10 }
        },
        y: {
          display: true,
          grid: { color: '#21262d', drawBorder: false },
          ticks: {
            color: '#484f58', font: { size: 10 },
            callback: (v) => '$' + v.toLocaleString()
          }
        }
      }
    }
  });
}

// ======== FETCH ========
async function fetchData() {
  try {
    const resp = await fetch('/api/status');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return await resp.json();
  } catch (e) {
    console.error('Fetch error:', e);
    return null;
  }
}

// ======== RENDERERS ========

function renderHeader(d) {
  const ex = d.exchange;
  const isOnline = d.processes && d.processes.some(p => p.status === 'online');
  const isDryRun = ex && ex.dryRun;

  let statusText = isOnline ? '🟢 运行中' : '🔴 离线';
  if (isDryRun) statusText += ' · 模拟';

  let cls = isOnline ? 'online' : 'offline';
  if (isDryRun) cls += ' dry-run';

  return '<div class="header">' +
    '<div class="header-left">' +
      '<div class="logo">LE VAN <span>DO</span>®</div>' +
      '<span class="status-pill ' + cls + '">' +
        '<span class="status-dot ' + (isOnline ? 'green' : 'red') + '"></span>' + esc(statusText) +
      '</span>' +
      (ex ? '<span class="status-pill ' + (ex.status === 'connected' ? 'online' : 'offline') + '">' +
        '<span class="status-dot ' + (ex.status === 'connected' ? 'green' : 'red') + '"></span>' +
        esc(ex.network || '--') + '</span>' : '') +
    '</div>' +
    '<div class="header-right">' +
      '<div class="refresh-bar">' +
        '<span class="countdown" id="countdown">' + countdownValue + 's</span>' +
        '<div class="bar-track"><div class="bar-fill" id="refreshBarFill"></div></div>' +
      '</div>' +
      '<span style="font-size:11px;color:#8b949e">⬆ ' + esc(d.server ? d.server.uptime : '--') + '</span>' +
      '<span style="font-size:11px;color:#484f58">' + fmtTime(d.server ? d.server.time : new Date().toISOString()) + '</span>' +
    '</div>' +
  '</div>';
}

function renderStats(d) {
  const eq = d.equity || {};
  const initCap = eq.initial_capital || 10000;
  const equity = eq.equity != null ? eq.equity : initCap;
  const totalPnl = eq.total_pnl != null ? eq.total_pnl : 0;
  const positions = d.positions || [];
  const sig = d.signals || {};
  const totalSig = sig.total || 0;

  const pnlClr = totalPnl >= 0 ? '#0ecb81' : '#f6465d';
  const pnlPrefix = totalPnl >= 0 ? '+' : '';
  const pnlPct = initCap > 0 ? ((equity - initCap) / initCap * 100) : 0;

  return '<div class="card"><div class="card-title">📊 账户总览</div>' +
    '<div class="stats-grid">' +
      '<div class="stat-card accent-equity">' +
        '<div class="stat-icon">💰</div>' +
        '<div class="stat-value" style="color:#58a6ff">$' + Number(equity).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) + '</div>' +
        '<div class="stat-label">总权益</div>' +
        '<div class="stat-change ' + (totalPnl >= 0 ? 'positive' : 'negative') + '">' +
          pnlPrefix + pnlPct.toFixed(2) + '%</div>' +
      '</div>' +
      '<div class="stat-card accent-pnl">' +
        '<div class="stat-icon">📈</div>' +
        '<div class="stat-value" style="color:' + pnlClr + '">' + pnlPrefix + '$' + Math.abs(totalPnl).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) + '</div>' +
        '<div class="stat-label">总盈亏</div>' +
        '<div class="stat-change ' + (totalPnl >= 0 ? 'positive' : 'negative') + '">初始 $' + Number(initCap).toLocaleString() + '</div>' +
      '</div>' +
      '<div class="stat-card accent-positions">' +
        '<div class="stat-icon">💼</div>' +
        '<div class="stat-value" style="color:#d29922">' + positions.length + '</div>' +
        '<div class="stat-label">持仓数量</div>' +
        '<div class="stat-change">' + (positions.filter(p => p.side === 'long').length + '多') + ' · ' + (positions.filter(p => p.side === 'short').length + '空') + '</div>' +
      '</div>' +
      '<div class="stat-card accent-signals">' +
        '<div class="stat-icon">📡</div>' +
        '<div class="stat-value" style="color:#f0883e">' + totalSig + '</div>' +
        '<div class="stat-label">累计信号</div>' +
        '<div class="stat-change">' + (sig.botTotal ? 'Bot ' + sig.botTotal : '') + '</div>' +
      '</div>' +
    '</div></div>';
}

function renderRiskExposure(d) {
  const positions = d.positions || [];
  if (positions.length === 0) return '';

  let totalExposure = 0;
  let totalMargin = 0;
  let longExposure = 0;
  let shortExposure = 0;

  for (const p of positions) {
    const entry = p.entry_price || 0;
    const sz = p.size || 0;
    const val = entry * sz;
    totalExposure += val;
    const lev = p.leverage || 1;
    totalMargin += val / lev;
    if (p.side === 'long') longExposure += val;
    else shortExposure += val;
  }

  const eq = d.equity || {};
  const equity = eq.equity || eq.initial_capital || 10000;
  const marginRatio = equity > 0 ? (totalMargin / equity * 100) : 0;
  const usedMarginPct = marginRatio.toFixed(1) + '%';
  const marginColor = marginRatio > 50 ? '#f6465d' : (marginRatio > 30 ? '#d29922' : '#0ecb81');

  return '<div class="card"><div class="card-title">🛡️ 风控敞口</div>' +
    '<div class="risk-grid">' +
      '<div class="risk-item">' +
        '<div class="ri-value" style="color:#58a6ff">$' + totalExposure.toLocaleString('en-US', {minimumFractionDigits:2}) + '</div>' +
        '<div class="ri-label">总敞口</div>' +
      '</div>' +
      '<div class="risk-item">' +
        '<div class="ri-value" style="color:' + marginColor + '">$' + totalMargin.toLocaleString('en-US', {minimumFractionDigits:2}) + '</div>' +
        '<div class="ri-label">占用保证金</div>' +
      '</div>' +
      '<div class="risk-item">' +
        '<div class="ri-value">$' + (equity - totalMargin).toLocaleString('en-US', {minimumFractionDigits:2}) + '</div>' +
        '<div class="ri-label">可用资金</div>' +
      '</div>' +
    '</div>' +
    '<div style="margin-top:10px">' +
      '<div class="stat-row"><span class="label">多仓敞口</span><span class="value" style="color:#0ecb81">$' + longExposure.toLocaleString('en-US', {minimumFractionDigits:2}) + '</span></div>' +
      '<div class="stat-row"><span class="label">空仓敞口</span><span class="value" style="color:#f6465d">$' + shortExposure.toLocaleString('en-US', {minimumFractionDigits:2}) + '</span></div>' +
      '<div class="stat-row"><span class="label">保证金占比</span><span class="value" style="color:' + marginColor + '">' + usedMarginPct + '</span></div>' +
    '</div></div>';
}

function renderEquityChartSection(d) {

function renderSystem(d) {
  const sys = d.system;
  if (!sys) return '';
  const mem = sys.memory || {};
  const disk = sys.disk || {};
  const cpu = sys.cpu || {};
  const memPct = mem.usagePercent || 0;
  const diskPct = disk.usagePercent || 0;

  function barColor(pct) {
    if (pct > 80) return 'red';
    if (pct > 60) return 'yellow';
    return 'green';
  }

  return '<div class="card"><div class="card-title">🖥️ 系统资源</div><div class="grid-3">' +
    '<div><div class="stat-value">' + memPct + '%</div><div class="stat-label">内存</div>' +
    '<div style="margin-top:6px;font-size:11px;color:#8b949e">' + fmtBytes(mem.used || 0) + ' / ' + fmtBytes(mem.total || 0) + '</div>' +
    '<div class="progress-bar" style="margin-top:4px"><div class="progress-fill ' + barColor(memPct) + '" style="width:' + memPct + '%"></div></div></div>' +
    '<div><div class="stat-value">' + diskPct + '%</div><div class="stat-label">磁盘</div>' +
    '<div style="margin-top:6px;font-size:11px;color:#8b949e">' + fmtBytes(disk.used || 0) + ' / ' + fmtBytes(disk.total || 0) + '</div>' +
    '<div class="progress-bar" style="margin-top:4px"><div class="progress-fill ' + barColor(diskPct) + '" style="width:' + diskPct + '%"></div></div></div>' +
    '<div><div class="stat-value">' + (cpu.cores || '--') + '</div><div class="stat-label">CPU 核心 · 负载</div>' +
    '<div style="margin-top:6px;font-size:11px;color:#8b949e">1m: ' + (cpu.loadAvg ? cpu.loadAvg[0] : '--') + ' · 5m: ' + (cpu.loadAvg ? cpu.loadAvg[1] : '--') + '</div></div>' +

}

function renderProcesses(d) {

  return html + '</div></div>';
}

function renderSymbols(d) {
  const syms = d.symbols || [];
  if (syms.length === 0) return '';
  const ok = syms.filter(s => s.status === 'ok').length;
  const noData = syms.filter(s => s.status === 'no_data').length;
  const err = syms.filter(s => s.status === 'error').length;

    ok + '/' + syms.length + ' 正常 · ' + noData + ' 等待 · ' + err + ' 异常</span></div><div class="symbol-grid">';

    html += '<div class="symbol-cell ' + esc(s.status) + '">' +
      '<span class="sym-name">' + esc(s.symbol) + '</span>' +
      (s.price ? '<span class="sym-price">$' + parseFloat(s.price).toFixed(s.price < 1 ? 6 : 2) + '</span>' : '<span class="sym-price">' + (s.status === 'ok' ? '✓' : (s.status === 'error' ? '✗' : '—')) + '</span>') +
    '</div>';
  }

}

function renderSignals(d) {
  const sig = d.signals || {};
  const counts = sig.counts || {};
  const recent = sig.recent || [];
  const totalSig = sig.total || 0;

  let html = '<div class="card"><div class="card-title">📡 策略信号 <span style="font-weight:400;color:#484f58;font-size:11px">' +
    '累计 ' + totalSig + (sig.botTotal ? ' · Bot ' + sig.botTotal : '') + '</span></div>';

  // Signal count badges
  html += '<div class="signal-counts" style="margin-bottom:12px">';
  const cfgs = [
    { k: 'longE', l: '多头开仓', c: '#3fb950' },
    { k: 'shortE', l: '空头开仓', c: '#f85149' },
    { k: 'longX', l: '多头平仓', c: '#58a6ff' },
    { k: 'shortX', l: '空头平仓', c: '#d29922' },
  ];
  for (const c of cfgs) {
    const v = counts[c.k] || 0;
    html += '<div class="signal-count-item" style="border-left:3px solid ' + c.c + '">' +
      '<div class="sc-value" style="color:' + c.c + '">' + v + '</div><div class="sc-label">' + c.l + '</div></div>';

    html += renderSignalRows(recent);
    html += '</tbody></table></div>';

// Signal table sort state
let signalSortAsc = false;

function toggleSignalSort() {
  signalSortAsc = !signalSortAsc;
  refresh(); // re-fetch and re-render
}

function parseCondition(sigType) {
  // Map signal types to condition numeric value for sorting
  const condMap = {
    'longE': 1.0, 'shortE': -1.0,
    'longTP1': 1.1, 'shortTP1': -1.1,
    'longTP2': 1.2, 'shortTP2': -1.2,
    'longTP3': 1.3, 'shortTP3': -1.3,
    'longSL': 0.0, 'shortSL': 0.0,
    'longX': 0.0, 'shortX': 0.0,
    'none': 0.0,
  };
  return condMap[sigType] ?? 0.0;
}

function renderSignalRows(recent) {
  // Sort by condition value
  const sorted = [...recent].sort((a, b) => {
    const ca = parseCondition(a.type);
    const cb = parseCondition(b.type);
    return signalSortAsc ? ca - cb : cb - ca;
  });

  let html = '';
  for (const r of sorted) {
    const condVal = parseCondition(r.type);
    const condStr = condVal > 0 ? '+' + condVal.toFixed(1) : condVal.toFixed(1);
    const sigClass = 'sig-' + r.type;
    html += '<tr><td style="color:#8b949e;font-size:11px">' + fmtTime(r.time) + '</td>' +
      '<td><span class="signal-type ' + sigClass + '">' + esc(r.type) + '</span></td>' +
      '<td>' + esc(r.symbol) + '</td>' +
      '<td style="font-family:Consolas,monospace;font-size:11px;color:' + (condVal > 0 ? '#3fb950' : (condVal < 0 ? '#f85149' : '#484f58')) + '">' + condStr + '</td>' +
      '<td>' + (r.price ? '$' + esc(r.price) : '—') + '</td></tr>';
  }
  return html;
}

function renderPositions(d) {
  const positions = d.positions || [];
  let html = '<div class="card"><div class="card-title">💼 持仓 <span style="font-weight:400;color:#6a7283;font-size:11px">' + positions.length + ' 个持仓</span></div>';

  // Equity summary bar
  const eq = d.equity || {};
  const totalPnl = eq.total_pnl;
  if (totalPnl != null) {
    const initCap = eq.initial_capital || 0;
    const equityVal = eq.equity || (initCap + totalPnl);
    html += '<div style="display:flex;gap:16px;padding:10px 16px;margin-bottom:12px;background:linear-gradient(135deg,#1a1d29 0%,#0d1117 100%);border-radius:8px;border:1px solid #2d3343">' +
      '<div style="text-align:center;min-width:90px"><div style="font-size:10px;color:#6a7283;text-transform:uppercase">初始资金</div><div style="font-size:18px;font-weight:700;font-family:Consolas,monospace;margin-top:3px;color:#f0f6fc">$' + initCap.toLocaleString('en-US', {minimumFractionDigits:2}) + '</div></div>' +
      '<div style="text-align:center;min-width:90px"><div style="font-size:10px;color:#6a7283;text-transform:uppercase">总权益</div><div style="font-size:18px;font-weight:700;font-family:Consolas,monospace;margin-top:3px;color:#f0f6fc">$' + Number(equityVal).toLocaleString('en-US', {minimumFractionDigits:2}) + '</div></div>' +
      '<div style="text-align:center;min-width:90px"><div style="font-size:10px;color:#6a7283;text-transform:uppercase">总盈亏</div><div style="font-size:18px;font-weight:700;font-family:Consolas,monospace;margin-top:3px;' + pnlCls(totalPnl) + '">' + pnlSign(totalPnl) + '$' + Math.abs(totalPnl).toLocaleString('en-US', {minimumFractionDigits:2}) + '</div></div>' +
    '</div>';
  }

  if (positions.length === 0) {
    html += '<div class="empty-state"><div class="icon">📦</div><div class="text">暂无持仓</div></div>';
  } else {
    for (const p of positions) {
      const isLong = p.side === 'long';
      const posClass = isLong ? 'long' : 'short';
      const sideLabel = isLong ? '多' : '空';

      const pnlVal = p.pnl;
      const pnlPctVal = p.pnl_pct;
      let pnlStr = '—';
      let pnlPctStr = '';
      if (pnlVal != null) {
        pnlStr = pnlSign(pnlVal) + '$' + Math.abs(pnlVal).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
      }
      if (pnlPctVal != null) {
        pnlPctStr = ' (' + pnlSign(pnlPctVal) + pnlPctVal.toFixed(2) + '%)';
      }

      const entryStr = fmtPrice(p.entry_price);
      const markStr = fmtPrice(p.current_price);
      const leverageStr = p.leverage != null ? p.leverage + 'x' : '—';
      const marginStr = p.margin != null ? '$' + Number(p.margin).toFixed(2) : '—';

      // Entry time
      const entryTimeStr = p.entry_time ? fmtTime(p.entry_time) : '—';

      // Condition (model probability proxy)
      const condVal = p.condition != null ? p.condition : (isLong ? 1.0 : -1.0);
      const condStr = condVal > 0 ? '+' + condVal.toFixed(1) : condVal.toFixed(1);
      const condColor = isLong ? '#3fb950' : '#f85149';

      // TP batch
      const tpPrices = p.tp_prices || [null, null, null];
      const tpStatus = p.tp_status || ['pending','pending','pending'];
      function tpOne(idx) {
        const st = tpStatus[idx];
        const pr = tpPrices[idx];
        if (pr == null || pr <= 0) return '<span style="color:#6a7283">--</span>';
        const ps = Number(pr).toFixed(pr < 1 ? 6 : 2);
        if (st === 'hit') return '<span style="color:#0ecb81">' + ps + '</span>';
        if (st === 'missed') return '<span style="color:#f6465d">' + ps + '</span>';
        return '<span style="color:#6a7283">' + ps + '</span>';
      }
      const tpLine = tpOne(0) + '/' + tpOne(1) + '/' + tpOne(2);

      // PnL attribution per batch
      const tpPnl = p.tp_pnl || [0, 0, 0];
      function batchOne(idx) {
        const st = tpStatus[idx];
        if (st === 'hit') {
          const pv = tpPnl[idx] || 0;
          return '<span style="color:' + (pv >= 0 ? '#0ecb81' : '#f6465d') + '">TP' + (idx+1) + ':' + pnlSign(pv) + '$' + Math.abs(pv).toFixed(2) + '</span>';
        } else if (st === 'missed') {
          return '<span style="color:#f6465d">TP' + (idx+1) + ':SL</span>';
        }
        return '<span style="color:#6a7283">TP' + (idx+1) + ':--</span>';
      }
      const batchLine = batchOne(0) + ' | ' + batchOne(1) + ' | ' + batchOne(2);

      // Price color relative to entry
      function priceColor(price, ref) {
        if (price == null || ref == null || ref <= 0) return '';
        const diff = Number(price) - Number(ref);
        if (isLong) return diff >= 0 ? 'color:#0ecb81' : 'color:#f6465d';
        return diff <= 0 ? 'color:#0ecb81' : 'color:#f6465d';
      }

      html += '<div class="pos-card ' + posClass + '">' +
        '<span class="pos-symbol">' + esc(p.symbol) + '</span>' +
        '<span class="pos-lev">' + leverageStr + '</span>' +
        '<span class="pos-side ' + p.side + '">' + sideLabel + '</span>' +
        '<span class="pos-cond" title="模型条件/概率">' + condStr + '</span>' +
        '<span class="sep"></span>' +
        // Size
        '<span class="pf"><span class="fl">数量</span><span class="fv">' + (p.size != null ? Number(p.size).toFixed(4) : '—') + '</span></span>' +
        // Margin
        '<span class="pf"><span class="fl">保证金</span><span class="fv">' + marginStr + '</span></span>' +
        '<span class="sep"></span>' +
        // Entry price
        '<span class="pf"><span class="fl">入场价</span><span class="fv">' + (entryStr ? '$' + entryStr : '—') + '</span></span>' +
        // Current price
        '<span class="pf"><span class="fl">现价</span><span class="fv" style="' + priceColor(p.current_price, p.entry_price) + '">' + (markStr ? '$' + markStr : '—') + '</span></span>' +
        '<span class="sep"></span>' +
        // Entry time
        '<span class="pf"><span class="fl">开仓时间</span><span class="fv" style="font-size:10px;color:#8b949e;font-weight:400">' + entryTimeStr + '</span></span>' +
        '<span class="sep"></span>' +
        // TP
        '<span class="pf"><span class="fl">TP1/2/3</span><span class="fv" style="font-size:10px;font-family:Consolas,monospace">' + tpLine + '</span></span>' +
        // Batch PnL
        '<span class="pf" style="min-width:120px"><span class="fl">分批盈亏</span><span class="fv" style="font-size:10px;font-family:Consolas,monospace">' + batchLine + '</span></span>' +
        '<span class="sep"></span>' +
        // PnL
        '<span class="pf" style="min-width:70px;text-align:right"><span class="fl">盈亏</span><span class="fv ' + pnlCls(pnlVal) + '">' + pnlStr + pnlPctStr + '</span></span>' +
      '</div>';
    }
  }
  return html + '</div>';
}

function renderClosedTrades(d) {
  const closed = d.closed_trades || [];
  const summary = d.closed_trades_summary || { count: 0, total_closed_pnl: 0 };
  const totalPnl = summary.total_closed_pnl || 0;
  const tradeCount = summary.count || 0;
  const pnlColor = totalPnl >= 0 ? '#3fb950' : '#f85149';
  const pPrefix = totalPnl > 0 ? '+' : '';

  let html = '<div class="card"><div class="card-title">📜 历史平仓 <span style="font-weight:400;color:#484f58;font-size:11px">共 ' + tradeCount + ' 笔 · 总盈亏 <span style="color:' + pnlColor + ';font-weight:600">' + pPrefix + '$' + Math.abs(totalPnl).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) + '</span></span></div>';

  if (closed.length === 0) {
    html += '<div class="empty-state"><div class="icon">📭</div><div class="text">暂无平仓记录</div></div>';
  } else {
    html += '<div style="max-height:400px;overflow-y:auto"><table class="signal-table"><thead><tr>' +
      '<th>品种</th><th>方向</th><th>杠杆</th><th>入场价</th><th>平仓价</th><th>盈亏</th><th>收益率</th><th>开仓时间</th><th>平仓时间</th><th>归因</th></tr></thead><tbody>';
    for (const t of closed) {
      const sideColor = t.side === 'long' ? '#0ecb81' : '#f6465d';
      const sideLabel = t.side === 'long' ? '多' : '空';
      const levStr = t.leverage != null ? t.leverage + 'x' : '—';

      let pnlColor = '#8b949e', ps = '', pnlStr = '—';
      if (t.pnl != null) {
        pnlColor = t.pnl > 0 ? '#0ecb81' : (t.pnl < 0 ? '#f6465d' : '#8b949e');
        ps = t.pnl > 0 ? '+' : '';
        pnlStr = ps + '$' + Math.abs(t.pnl).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
      }

      let pnlPctStr = '—';
      if (t.pnl_pct != null) {
        const pctSign = t.pnl_pct > 0 ? '+' : '';
        pnlPctStr = pctSign + t.pnl_pct.toFixed(2) + '%';
      }

      const entryStr = t.entry_price ? Number(t.entry_price).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:6}) : '—';
      const exitStr = t.exit_price ? Number(t.exit_price).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:6}) : '—';

      const entryTimeStr = t.entry_time ? fmtTime(t.entry_time) : '—';
      const closeTimeStr = t.close_time ? fmtTime(t.close_time) : '—';

      // Attribution: TP1/TP2/TP3/SL/Manual
      let attribution = '—';
      if (t.tp_order === 1) attribution = '<span style="color:#0ecb81;font-weight:600">TP1</span>';
      else if (t.tp_order === 2) attribution = '<span style="color:#0ecb81;font-weight:600">TP2</span>';
      else if (t.tp_order === 3) attribution = '<span style="color:#0ecb81;font-weight:600">TP3</span>';
      else if (t.tp_order === 0) attribution = '<span style="color:#f6465d;font-weight:600">SL</span>';

      // Enhanced attribution details
      let attrDetail = '';
      if (t.tp_target && t.tp_target > 0) {
        attrDetail = '<br><span style="font-size:9px;color:#6a7283">目标 $' + Number(t.tp_target).toFixed(t.tp_target < 1 ? 6 : 2) + '</span>';
      }

      html += '<tr><td style="white-space:nowrap"><strong>' + esc(t.symbol) + '</strong></td>' +
        '<td><span style="color:' + sideColor + ';font-weight:600">' + sideLabel + '</span></td>' +
        '<td style="text-align:center">' + levStr + '</td>' +
        '<td style="text-align:right;font-variant-numeric:tabular-nums">' + entryStr + '</td>' +
        '<td style="text-align:right;font-variant-numeric:tabular-nums">' + exitStr + '</td>' +
        '<td style="text-align:right;font-weight:600;color:' + pnlColor + '">' + pnlStr + '</td>' +
        '<td style="text-align:right;font-weight:600;color:' + pnlColor + '">' + pnlPctStr + '</td>' +
        '<td style="color:#8b949e;font-size:10px;white-space:nowrap">' + entryTimeStr + '</td>' +
        '<td style="color:#8b949e;font-size:10px;white-space:nowrap">' + closeTimeStr + '</td>' +
        '<td style="text-align:center">' + attribution + attrDetail + '</td>' +
      '</tr>';
    }
    html += '</tbody></table></div>';
  }
  return html + '</div>';
}

function renderFooter() {
  return '<div class="footer">LE VAN DO® 交易机器人 · 数据每 ' + (FETCH_INTERVAL / 1000) + ' 秒自动刷新 · ' +
    '<a href="/health" style="color:#58a6ff;text-decoration:none">/health</a> · ' +
    '<a href="/api/status" style="color:#58a6ff;text-decoration:none">/api/status</a></div>';
}

// ======== MAIN RENDER ========
function renderDashboard(d) {
  const html = renderHeader(d) +
    renderStats(d) +
    renderRiskExposure(d) +
    renderEquityChartSection(d) +
    renderSystem(d) +
    renderProcesses(d) +
    renderExchange(d) +
    renderSymbols(d) +
    renderSignals(d) +
    renderPositions(d) +
    renderClosedTrades(d) +
    renderFooter();

  document.getElementById('app').innerHTML = html;

  // Render Chart.js after DOM update
  const eq = d.equity || {};
  const equity = eq.equity != null ? eq.equity : (eq.initial_capital || 10000);
  renderEquityChart(loadEquityHistory(), equity);
}

// ======== REFRESH & COUNTDOWN ========
async function refresh() {
  const d = await fetchData();
  if (!d) {
    document.getElementById('app').innerHTML =
      '<div class="container"><div class="empty-state" style="padding:80px 20px">' +
      '<div class="icon">⚠️</div><div class="text">无法连接到服务器</div>' +
      '<p style="color:#8b949e;font-size:13px;margin-top:8px">请确认 /api/status 端点可访问</p></div></div>';
    return;
  }
  document.getElementById('loading').style.display = 'none';

  // Preserve equity chart instance if it exists
  const oldChart = equityChart;
  renderDashboard(d);

  // If chart was destroyed by re-render, restore reference
  if (oldChart && !equityChart) {
    // Chart was recreated inside renderDashboard via renderEquityChartSection
  }

  resetCountdown();
}

function resetCountdown() {
  countdownValue = FETCH_INTERVAL / 1000;
  updateCountdownUI();
}

function updateCountdownUI() {
  const el = document.getElementById('countdown');
  const bar = document.getElementById('refreshBarFill');
  if (el) el.textContent = countdownValue + 's';
  if (bar) {
    const pct = ((FETCH_INTERVAL / 1000 - countdownValue) / (FETCH_INTERVAL / 1000)) * 100;
    bar.style.width = pct + '%';
  }
}

function startCountdown() {
  resetCountdown();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    countdownValue--;
    if (countdownValue <= 0) {
      countdownValue = FETCH_INTERVAL / 1000;
      refresh();
    }
    updateCountdownUI();
  }, 1000);
}

document.addEventListener('DOMContentLoaded', () => {
  refresh();
  startCountdown();
});
</script>
</body>
</html>
